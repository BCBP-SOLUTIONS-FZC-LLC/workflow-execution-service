version: "2"

run:
  go: '1.26'
  concurrency: 1

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - exhaustive
    - wrapcheck
    - revive
    - misspell
    - unconvert
    - unparam
    - bodyclose
    - noctx
    - nilerr
    - gosec
    - contextcheck
    - gocritic
    - nolintlint
    - sqlclosecheck
  settings:
    revive:
      rules:
        - name: var-naming
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
    nolintlint:
      require-explanation: true
      require-specific: true
    wrapcheck:
      ignore-package-globs:
        - github.com/BCBP-SOLUTIONS-FZC-LLC/execution-service/*

  exclusions:
    paths:
      - platform-libs/
      - internal/adapter/outbound/postgres/db/
      - internal/core/port/mocks/
      - test/integration/
    rules:
      - path: _test\.go
        linters:
          - wrapcheck
          - unparam
          - noctx
          - gosec
      - path: ^test/
        linters:
          - noctx
          - gosec
      - path: ^(cmd|test)/
        text: exitAfterDefer
        linters:
          - gocritic
      - path: internal/
        text: "exported: "
        linters:
          - revive

formatters:
  enable:
    - goimports
  exclusions:
    paths:
      - platform-libs/
      - internal/adapter/outbound/postgres/db/
      - internal/core/port/mocks/
