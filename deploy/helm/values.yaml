image:
  # Two images from one multi-target Dockerfile — repository is the shared
  # base; each Deployment appends its own -server/-worker suffix and target.
  repository: ghcr.io/bcbp-solutions-fzc-llc/workflow-execution-service
  tag: ""
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

# replicas:2 on both is a stated LLD §7.5 precondition, not an arbitrary
# choice: minAvailable:1 at replicas:1 would let the PDB block every
# voluntary disruption including the rollout itself (maxSurge:0 requires the
# old pod gone before the new one starts). Environments intentionally
# running at replicas:1 must delete the PDB manually first.
api:
  replicas: 2
  httpPort: 8080
  metricsPort: 9091  # /metrics only — served on its own http.Server (cmd/server/wire.go)
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
    # Documented optional hook, disabled by default — RPS-based scaling is
    # more accurate than CPU for an I/O-bound HTTP service, mirroring
    # definition_service's own API HPA. PREREQUISITE: the prometheus-adapter
    # must be installed and configured with the rule at
    # deploy/monitoring/prometheus-adapter-rule.yaml. Without it this metric
    # is silently absent from the custom metrics API and HPA falls back to
    # CPU/memory only.
    targetRPSPerReplica: ""

worker:
  replicas: 2
  healthPort: 8081
  metricsPort: 8082  # /metrics only — served on its own http.Server (cmd/worker/health.go's newMetricsServer)
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
    # Documented future hook, not wired by default: the LLD (§7.5, Appendix
    # A.6 #4) commits the Worker's HPA to scaling on Temporal queue
    # depth/task backlog rather than CPU, since Worker load is bursty
    # per-task-queue — but no such metric exists anywhere in the LLD's own
    # §7.6 catalogue (checked exhaustively; closest are worker_active_queues,
    # a queue count, and worker_queue_last_poll_timestamp, a timestamp).
    # Once a real backlog metric exists, set targetBacklogPerReplica to
    # enable this block. PREREQUISITE: prometheus-adapter must be installed
    # with a rule exposing that metric via the custom/external metrics API —
    # without it this block is silently absent from the HPA and scaling
    # falls back to CPU/memory alone (see hpa-worker.yaml).
    targetBacklogPerReplica: ""

connectorWorker:
  enabled: false
  replicas: 2
  healthPort: 8081
  # Shutdown lets every started connector run finish and report, waiting up to
  # the longest CONNECTOR_TIMEOUT_* plus CONNECTOR_COMPLETION_TIMEOUT plus 10s
  # (75s with the defaults), then gives the health server 5s. Keep this above
  # that total.
  terminationGracePeriodSeconds: 90
  streamKey: connector-tasks
  streamGroup: connector-worker
  executionServiceInternalAddr: http://workflow-execution-service-api:8080
  openBaoAddr: ""
  openBaoMount: secret
  docsBucket: ""
  retry:
    maxAttempts: 5
    initialBackoff: 500ms
    maxBackoff: 10s
  auditRetention: 2160h
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

ingress:
  enabled: false
  type: HTTPRoute

  hosts:
    - host: workflow-execution-service.example.com
      # Only the public route groups. /api/v1/internal is service-to-service
      # (LLD §5.3) and must never be routed by the gateway, so a broad /api/v1
      # prefix is not used.
      paths:
        - path: /api/v1/instances
          pathType: PathPrefix
        - path: /api/v1/tasks
          pathType: PathPrefix
        - path: /api/v1/workflows/active-by-user
          pathType: Exact

  gateway:
    name: ""              # required when ingress.enabled and type is HTTPRoute
    namespace: ""         # optional — defaults to the release namespace
    sectionName: ""       # optional — target a specific listener (e.g. "https")

  securityPolicy:
    enabled: false
    cors:
      enabled: false
      allowOrigins: []
      allowMethods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowHeaders:
        - Authorization
        - Content-Type
        - X-Idempotency-Key
      maxAge: "86400"

podDisruptionBudget:
  minAvailable: 1

serviceAccount:
  # Two separate ServiceAccounts (api, worker), not one shared — the API
  # process needs SNS-publish permissions the Worker never does;
  # least-privilege IRSA scoping is worth the extra manifest over one
  # over-permissioned identity.
  create: true
  annotations: {}

securityContext:
  runAsNonRoot: true
  runAsUser: 65532 # distroless nonroot UID
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# The Definition Service's internal HTTP Service, read by the API (compiled
# plans), the Worker (GetCompiledPlan) and the connector-worker (the alias
# registry) — LLD §5.3. Its token is secret.secretValues.DEFINITION_SERVICE_TOKEN.
definitionServiceURL: http://workflow-definition-service:8080

# Plain env vars — non-secret config only, matching internal/config's real
# fields. Secrets (INTERNAL_API_TOKEN, DEFINITION_SERVICE_TOKEN, ...) come from
# the Secret below.
env:
  appEnv: prod
  otelServiceName: workflow-execution-service
  # OTLP collector address, for example otel-collector.observability:4317. Empty disables trace export.
  otelExporterEndpoint: ""
  otelExporterInsecure: "false"
  otelTracesSamplerRatio: "1.0"
  temporalNamespace: default
  temporalTaskQueue: execution-default
  awsRegion: us-east-1
  awsUseStub: "false"
  # Glue schema registry the API's SNS codec encodes against; required while awsUseStub is false.
  glueRegistryName: wf-workflow-events
  # The Org & Membership eligibility endpoint the API calls. Required: the API refuses to start without it.
  eligibilityBaseURL: ""
  # The identity subsystem's Token Service, read for each tenant's automation principal. Required outside dev.
  tokenServiceBaseURL: ""
  outboxPollInterval: 500ms
  outboxBatchSize: "50"

# Secret-backed env vars. existingSecretName takes precedence when set;
# secretValues is for CI/values-overlay injection — never commit real
# values here (mirrors definition_service's dual-mode secret.yaml).
secret:
  # An existing Secret must carry every key secretValues lists, OUTBOX_RELAY_DATABASE_URL and
  # SNS_TOPIC_ARN included: the render-time key checks are skipped, so a missing key shows as
  # CreateContainerConfigError at pod start.
  existingSecretName: ""
  secretValues:
    DATABASE_URL: ""
    VALKEY_ADDR: ""
    VALKEY_PASSWORD: ""
    TEMPORAL_HOST_PORT: ""
    SNS_TOPIC_ARN: ""
    # The outbox relay's own DSN, a role with BYPASSRLS; required outside dev.
    OUTBOX_RELAY_DATABASE_URL: ""
    OPENBAO_TOKEN: ""
    # This service's own token, which its internal-API callers present.
    INTERNAL_API_TOKEN: ""
    # The Definition Service's INTERNAL_API_TOKEN, sent on its internal API.
    DEFINITION_SERVICE_TOKEN: ""

# LLD §7.5's mTLS/namespace-bootstrap note: registering the Temporal
# namespace and provisioning mTLS material are cluster-operator actions this
# chart doesn't perform — it only mounts an already-provisioned cert/key
# pair when the cluster requires it.
temporalMTLS:
  enabled: false
  secretName: ""

networkPolicy:
  # LLD §5.7/§9.2: /internal/* must be restricted to the Shared
  # Workflow-Events Consumer and Definition Service. No dedicated internal
  # port exists yet (cmd/server has one httpPort for every route, and its
  # real listener isn't built), so this policy scopes all of port 8080 to
  # these pod identities — coarse L3/L4 defense-in-depth alongside the
  # x-internal-token app-layer check (LLD §5.7), not a replacement for it.
  # Revisit once a dedicated internal port exists.
  enabled: true
  # Regular browser-gateway traffic (/api/v1/* routes) — the same port
  # allowedCallers restricts for /internal/* traffic, since there's no
  # dedicated internal port to split them onto (see the note above).
  ingressControllerNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: gateway
  allowedCallers:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: workflow-events-consumer
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: workflow-definition-service
  # Named same-namespace egress targets, replacing a blanket podSelector: {}
  # allow. The Definition Service is the only same-namespace outbound
  # dependency of the API and the Worker (the compiled-plan read).
  allowedEgressTargets:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: workflow-definition-service
  metricsIngress:
    enabled: true
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring
    podSelector:
      matchLabels:
        app.kubernetes.io/name: prometheus
  additionalIngressRules: []
  additionalEgressRules: []

# Requires the Prometheus Operator CRDs (ServiceMonitor/PrometheusRule).
# Left disabled by default since neither this repo nor either reference repo
# assumes the Operator is installed in every target cluster.
serviceMonitor:
  enabled: false
  interval: 30s

migration:
  enabled: true
