image:
  # Three images from one multi-target Dockerfile (server, worker, connector-worker) —
  # repository is the shared base; each Deployment appends its own suffix and target.
  repository: ghcr.io/bcbp-solutions-fzc-llc/workflow-execution-service
  tag: ""
  pullPolicy: IfNotPresent

nameOverride: ""
# Fixed on purpose: the Services and ServiceAccounts render as workflow-execution-service-api,
# -worker and -connector-worker whatever the release is called, so the addresses below and the
# caller lists in the Definition and event consumer charts stay true. Install one release per namespace.
fullnameOverride: workflow-execution-service

# replicas:2 on both is a stated LLD §7.5 precondition, not an arbitrary
# choice: minAvailable:1 at replicas:1 would let the PDB block every
# voluntary disruption including the rollout itself (maxSurge:0 requires the
# old pod gone before the new one starts). Environments intentionally
# running at replicas:1 must delete the PDB manually first.
api:
  # GOMEMLIMIT for the API process; empty leaves the Go default.
  goMemLimit: ""
  replicas: 2
  httpPort: 8080
  metricsPort: 9091  # /metrics only — served on its own http.Server (cmd/server/wire.go)
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
    # Documented optional hook, disabled by default — RPS-based scaling is
    # more accurate than CPU for an I/O-bound HTTP service, mirroring
    # definition_service's own API HPA. PREREQUISITE: the prometheus-adapter
    # must be installed and configured with the rule at
    # deploy/monitoring/prometheus-adapter-rule.yaml. Without it this metric
    # is silently absent from the custom metrics API and HPA falls back to
    # CPU/memory only.
    targetRPSPerReplica: ""

worker:
  # GOMEMLIMIT for the worker process, for example 200MiB under a 256Mi limit; empty leaves the Go default.
  goMemLimit: ""
  replicas: 2
  healthPort: 8081
  metricsPort: 8082  # /metrics only — served on its own http.Server (cmd/worker/health.go's newMetricsServer)
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
    # Documented future hook, not wired by default: the LLD (§7.5, Appendix
    # A.6 #4) commits the Worker's HPA to scaling on Temporal queue
    # depth/task backlog rather than CPU, since Worker load is bursty
    # per-task-queue — but no such metric exists anywhere in the LLD's own
    # §7.6 catalogue (checked exhaustively; closest are worker_active_queues,
    # a queue count, and worker_queue_last_poll_timestamp, a timestamp).
    # Once a real backlog metric exists, set targetBacklogPerReplica to
    # enable this block. PREREQUISITE: prometheus-adapter must be installed
    # with a rule exposing that metric via the custom/external metrics API —
    # without it this block is silently absent from the HPA and scaling
    # falls back to CPU/memory alone (see hpa-worker.yaml).
    targetBacklogPerReplica: ""

connectorWorker:
  enabled: false
  replicas: 2
  healthPort: 8081
  # Shutdown lets every started connector run finish and report, waiting up to
  # the longest CONNECTOR_TIMEOUT_* plus CONNECTOR_COMPLETION_TIMEOUT plus 10s
  # (75s with the defaults), then gives the health server 5s. Keep this above
  # that total.
  terminationGracePeriodSeconds: 90
  streamKey: connector-tasks
  streamGroup: connector-worker
  executionServiceInternalAddr: http://workflow-execution-service-api:8080
  openBaoAddr: ""
  openBaoMount: secret
  docsBucket: ""
  retry:
    maxAttempts: 5
    initialBackoff: 500ms
    maxBackoff: 10s
  auditRetention: 2160h
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

ingress:
  enabled: false
  type: HTTPRoute

  hosts:
    - host: workflow-execution-service.example.com
      # Only the public route groups. /api/v1/internal is service-to-service
      # (LLD §5.3) and must never be routed by the gateway, so a broad /api/v1
      # prefix is not used.
      paths:
        - path: /api/v1/instances
          pathType: PathPrefix
        - path: /api/v1/tasks
          pathType: PathPrefix
        - path: /api/v1/workflows/active-by-user
          pathType: Exact

  gateway:
    name: ""              # required when ingress.enabled and type is HTTPRoute
    namespace: ""         # optional — defaults to the release namespace
    sectionName: ""       # optional — target a specific listener (e.g. "https")

  securityPolicy:
    enabled: false
    # Merges this route policy with the Gateway-level SecurityPolicy (Envoy Gateway
    # v1.8+). Unset, the route policy replaces the gateway's, dropping its JWT
    # validation and the authorisation filter that writes the identity headers.
    mergeType: StrategicMerge
    cors:
      enabled: false
      allowOrigins: []
      allowMethods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowHeaders:
        - Authorization
        - Content-Type
        - X-Idempotency-Key
      maxAge: "86400"

podDisruptionBudget:
  minAvailable: 1

serviceAccount:
  # Two separate ServiceAccounts (api, worker), not one shared — the API
  # process needs SNS-publish permissions the Worker never does;
  # least-privilege IRSA scoping is worth the extra manifest over one
  # over-permissioned identity.
  create: true
  annotations: {}

securityContext:
  runAsNonRoot: true
  runAsUser: 65532 # distroless nonroot UID
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# The Definition Service's internal HTTP Service, read by the API (compiled
# plans), the Worker (GetCompiledPlan) and the connector-worker (the alias
# registry) — LLD §5.3.
definitionServiceURL: http://workflow-definition-service:8080

# Plain env vars — non-secret config only, matching internal/config's real
# fields. Secrets (DATABASE_URL, OPENBAO_TOKEN, ...) come from
# the Secret below.
env:
  appEnv: prod
  otelServiceName: workflow-execution-service
  # OTLP collector address, for example otel-collector.observability:4317. Empty disables trace export.
  otelExporterEndpoint: ""
  otelExporterInsecure: "false"
  otelTracesSamplerRatio: "1.0"
  temporalNamespace: default
  temporalTaskQueue: execution-default
  awsRegion: us-east-1
  awsUseStub: "false"
  # Glue schema registry the API's SNS codec encodes against; required while awsUseStub is false.
  glueRegistryName: wf-workflow-events
  # The Org & Membership base URL; the API reads assignee eligibility under it. Required: the API refuses to start without it.
  eligibilityBaseURL: ""
  # The identity subsystem's Token Service, read for each tenant's automation principal. Required outside dev.
  tokenServiceBaseURL: ""
  # The Entitlements service (commercial namespace). When set, the API reads the tenant's dedicated_workflow_queue
  # grant at instance start and routes the instance to the tenant's own queue only when it is held; empty keeps
  # the registry (filled from the plan on TenantStateChanged) as the only rule. Not required in any environment.
  entitlementsBaseURL: ""
  # Bound on one Entitlements read.
  entitlementsClientTimeout: 5s
  # How long a tenant's feature flags stay fresh before the next read.
  entitlementsCacheTTL: 60s
  # A read that fails keeps serving the last flags for this long; beyond it the start falls back to the registry. Not below the TTL.
  entitlementsFreshnessBound: 10m
  outboxPollInterval: 500ms
  outboxBatchSize: "50"
  # Per-process Postgres pool ceiling. A worker runs up to 1,000 concurrent activities (200 per tenant
  # queue), so a value near the busiest activity concurrency avoids waiting on a connection.
  pgMaxConns: "10"
  # true when DATABASE_URL points at PgBouncer (simple protocol, transaction-local GUCs); then
  # secret.secretValues.LOCK_DATABASE_URL is required.
  pgBouncerMode: "false"
  queueTopologyPollInterval: 60s
  # Temporal sticky workflow cache entries per worker process; 0 keeps the SDK default of 10,000, which
  # does not fit a small memory limit.
  workflowCacheSize: "0"
  # Tenant statuses (comma-separated) for which POST /instances answers 409 TENANT_NOT_ACTIVE:
  # trial, active, past_due, cancelled, suspended, trial_expired, offboarded. An offboarded tenant
  # is always refused; empty falls back to the paused statuses below.
  startRefusedStatuses: "suspended,trial_expired,cancelled"
  # The tenant data purge (LLD §4.13): an offboarded tenant's instances, tasks and connector rows
  # are deleted this long after it left. The audit trail keeps its own retention.
  tenantPurgeEnabled: "true"
  tenantHistoryRetention: 61320h
  # How often the purge sweep runs, in whole hours; the purge-failure alert looks back over it plus two hours.
  retentionSweepInterval: 24h

# Secret-backed env vars. existingSecretName takes precedence when set;
# secretValues is for CI/values-overlay injection — never commit real
# values here (mirrors definition_service's dual-mode secret.yaml).
secret:
  # An existing Secret must carry every key secretValues lists, OUTBOX_RELAY_DATABASE_URL and
  # SNS_TOPIC_ARN included: the render-time key checks are skipped, so a missing key shows as
  # CreateContainerConfigError at pod start.
  existingSecretName: ""
  secretValues:
    DATABASE_URL: ""
    # A direct (not pooled) DSN for the migration job's advisory locks; required when DATABASE_URL points at PgBouncer.
    MIGRATION_DATABASE_URL: ""
    # A direct (not pooled) DSN for the tenant-event advisory lock; required outside dev when PG_BOUNCER_MODE is true.
    LOCK_DATABASE_URL: ""
    VALKEY_ADDR: ""
    VALKEY_PASSWORD: ""
    TEMPORAL_HOST_PORT: ""
    SNS_TOPIC_ARN: ""
    # The outbox relay's own DSN, a role with BYPASSRLS; required outside dev.
    OUTBOX_RELAY_DATABASE_URL: ""
    OPENBAO_TOKEN: ""
    # Optional. Sent as x-internal-token on the connector worker's calls to alias targets only;
    # empty sends the text "unset", because workflow-connectors refuses an empty token. The Workflow services' internal routes check no token.
    CONNECTOR_ALIAS_CALL_TOKEN: ""

# LLD §7.5's mTLS/namespace-bootstrap note: registering the Temporal
# namespace and provisioning mTLS material are cluster-operator actions this
# chart doesn't perform — it only mounts an already-provisioned cert/key
# pair when the cluster requires it.
temporalMTLS:
  enabled: false
  secretName: ""

networkPolicy:
  # LLD §5.7/§9.2: the internal routes are for in-cluster callers only. One HTTP port (8080) serves every
  # route, so this policy admits the gateway and the named callers onto that port (layer 3/4, no paths);
  # the authorizationPolicy below is what separates the internal paths from the public ones and one
  # caller from another. The mesh and these policies are the protection: the x-user-id and
  # x-tenant-roles headers the service checks are not a credential.
  enabled: true
  # Regular browser-gateway traffic (/api/v1/* routes), on the same port as the callers below.
  ingressControllerNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: gateway
  # Callers admitted to the API port: the event consumer, the Definition Service and Org & Membership.
  # An entry with a namespaceSelector matches pods of that namespace only; one without matches the
  # release namespace. The connector worker is admitted by the template itself when it is enabled.
  # PLACEHOLDER, confirm with Platform: the iam namespace and the Org & Membership pod label.
  allowedCallers:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: workflow-events-consumer
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: workflow-definition-service
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: iam-org-membership
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: iam
  # Named same-namespace egress targets, replacing a blanket podSelector: {}
  # allow. The Definition Service is the only same-namespace outbound
  # dependency of the API and the Worker (the compiled-plan read).
  allowedEgressTargets:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: workflow-definition-service
  # The API's reads of Org & Membership (eligibility) and the Token Service (the
  # automation principal), in the iam namespace on their ports.
  apiIamEgressTargets:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: iam-org-membership
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: iam
      ports: [8080]
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: iam-token-service
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: iam
      ports: [8080]
  # Egress to the Entitlements service in the commercial namespace. Rendered only when
  # env.entitlementsBaseURL is set and both ports and podSelector are non-empty. The pod labels and port are PLACEHOLDERS until
  # Platform names the real ones; replace them before enabling the setting.
  entitlementsEgress:
    podSelector:
      matchLabels:
        app.kubernetes.io/name: commercial-entitlements
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: commercial
    ports: [8080]
  metricsIngress:
    enabled: true
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: observability
    podSelector:
      matchLabels:
        app.kubernetes.io/name: prometheus
  additionalIngressRules: []
  additionalEgressRules: []

# authorizationPolicy: Istio AuthorizationPolicy (security.istio.io/v1, action ALLOW) that replaces the
# retired shared internal token. The mesh names each caller by its service account (mutual TLS), so the
# policy needs a sidecar on both ends; a caller without a mesh identity is refused on the internal paths.
# The first rule admits every request outside /api/v1/internal/* (gateway routes, probes, metrics).
# Each entry of internalRoutes then admits its own callers onto its own paths, one rule per entry.
# An entry with no caller renders no rule, so its paths stay closed. The policy selects the API pods.
# Turning it off leaves the NetworkPolicy alone in front of the internal routes: the render refuses that
# in staging and prod unless allowDisabled is true. PeerAuthentication (mesh-wide mTLS) is Platform's.
authorizationPolicy:
  enabled: true
  allowDisabled: false
  trustDomain: cluster.local
  # PLACEHOLDERS, confirm with Platform: the namespaces and ServiceAccount names below.
  # Istio matches a wildcard at the start or the end of a path only, hence "*/active-instances".
  # The route named connector-tasks also admits this chart's own connector worker (release namespace)
  # when connectorWorker.enabled is true; keep that name.
  internalRoutes:
    # The event consumer forwards the workflow, user and tenant events.
    - name: events
      paths:
        - /api/v1/internal/events/*
      callers:
        - namespace: workflow-app
          serviceAccount: workflow-events-consumer
    # The Definition Service: the archive guard and the pause of a removed member's tasks.
    - name: definition
      paths:
        - /api/v1/internal/users/*
        - "*/active-instances"
      callers:
        - namespace: workflow-app
          serviceAccount: workflow-definition-service
    # Org & Membership: the delegate impact preview and the bulk reassign and cancel.
    - name: workflow-client
      paths:
        - /api/v1/internal/workflows/delegate-impact
        - /api/v1/internal/workflows/reassign-delegate
        - /api/v1/internal/workflows/cancel-by-delegate
      callers:
        - namespace: iam
          serviceAccount: iam-org-membership
    # The connector worker resolves its tasks; the chart adds its principal.
    - name: connector-tasks
      paths:
        - /api/v1/internal/connector-tasks/*
      callers: []

# Requires the Prometheus Operator CRDs (ServiceMonitor, PodMonitor, PrometheusRule).
# Left disabled by default since neither this repo nor either reference repo
# assumes the Operator is installed in every target cluster.
serviceMonitor:
  enabled: false
  interval: 30s

migration:
  enabled: true
