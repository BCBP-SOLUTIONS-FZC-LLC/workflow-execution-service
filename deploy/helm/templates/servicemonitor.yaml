{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "workflow-execution-service.apiFullname" . }}
  labels:
    {{- include "workflow-execution-service.apiSelectorLabels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "workflow-execution-service.apiSelectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "workflow-execution-service.workerFullname" . }}
  labels:
    {{- include "workflow-execution-service.workerSelectorLabels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "workflow-execution-service.workerSelectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
{{- if .Values.connectorWorker.enabled }}
---
# The connector worker has no Service; it serves /metrics on its health port, and the
# dead-letter alert reads a counter only this process emits.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "workflow-execution-service.connectorWorkerFullname" . }}
  labels:
    {{- include "workflow-execution-service.connectorWorkerSelectorLabels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "workflow-execution-service.connectorWorkerSelectorLabels" . | nindent 6 }}
  podMetricsEndpoints:
    - port: health
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
{{- end }}
