apiVersion: v1
kind: Service
metadata:
  name: {{ include "workflow-execution-service.workerFullname" . }}
  labels:
    {{- include "workflow-execution-service.workerSelectorLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "workflow-execution-service.workerSelectorLabels" . | nindent 4 }}
  ports:
    - name: health
      port: {{ .Values.worker.healthPort }}
      targetPort: health
    - name: metrics
      port: {{ .Values.worker.metricsPort }}
      targetPort: metrics
