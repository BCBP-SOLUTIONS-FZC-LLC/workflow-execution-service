{{- if not .Values.secret.existingSecretName }}
{{- $required := list "DATABASE_URL" "TEMPORAL_HOST_PORT" }}
{{- range $required }}
{{- if not (index $.Values.secret.secretValues .) }}
{{- fail (printf "secret.secretValues.%s is required when secret.existingSecretName is unset" .) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "workflow-execution-service.fullname" . }}
  labels:
    {{- include "workflow-execution-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secret.secretValues }}
  {{- if $value }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
