{{- if not .Values.secret.existingSecretName }}
{{- $required := list "DATABASE_URL" "TEMPORAL_HOST_PORT" "VALKEY_ADDR" }}
{{- if not (has .Values.env.appEnv (list "dev" "local")) }}
{{- /* The binaries refuse to start without these outside dev (LLD §5.3, §7.6). */}}
{{- $required = concat $required (list "INTERNAL_API_TOKEN" "DEFINITION_SERVICE_TOKEN" "OUTBOX_RELAY_DATABASE_URL" "OPENBAO_TOKEN") }}
{{- end }}
{{- if eq (toString .Values.env.awsUseStub) "false" }}
{{- $required = append $required "SNS_TOPIC_ARN" }}
{{- end }}
{{- if eq (toString .Values.env.pgBouncerMode) "true" }}
{{- $required = concat $required (list "LOCK_DATABASE_URL" "MIGRATION_DATABASE_URL") }}
{{- end }}
{{- range $required }}
{{- if not (index $.Values.secret.secretValues .) }}
{{- fail (printf "secret.secretValues.%s is required when secret.existingSecretName is unset" .) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "workflow-execution-service.fullname" . }}
  labels:
    {{- include "workflow-execution-service.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- range $key, $value := .Values.secret.secretValues }}
  {{- if $value }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
