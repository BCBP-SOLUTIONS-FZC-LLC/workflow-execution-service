{{- if and .Values.ingress.enabled (eq (.Values.ingress.type | default "HTTPRoute") "HTTPRoute") }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "workflow-execution-service.apiFullname" . }}
  labels:
    {{- include "workflow-execution-service.apiSelectorLabels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ required "ingress.gateway.name is required when ingress.type is HTTPRoute" .Values.ingress.gateway.name }}
      {{- with .Values.ingress.gateway.namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with .Values.ingress.gateway.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  {{- if .Values.ingress.hosts }}
  hostnames:
    {{- range .Values.ingress.hosts }}
    - {{ .host | quote }}
    {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    {{- range .paths }}
    - matches:
        - path:
            type: {{ .pathType | default "PathPrefix" }}
            value: {{ .path | quote }}
      backendRefs:
        - name: {{ include "workflow-execution-service.apiFullname" $ }}
          port: {{ $.Values.api.httpPort }}
    {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
