# LLD §5.7/§9.2: the internal routes are for in-cluster callers only. cmd/server exposes one HTTP
# port for /api/v1/* (gateway traffic) and /api/v1/internal/* (service-to-service traffic), and a
# NetworkPolicy (layer 3/4) cannot tell paths apart, so this policy admits the gateway and the named
# callers onto that port. The AuthorizationPolicy (authorizationpolicy.yaml) separates the internal
# paths from the public ones and one caller from another. The mesh and these two policies are the
# protection: the x-user-id and x-tenant-roles headers the service checks are not a credential.
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "workflow-execution-service.apiFullname" . }}
  labels:
    {{- include "workflow-execution-service.apiSelectorLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "workflow-execution-service.apiSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Browser-gateway traffic for /api/v1/*.
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressControllerNamespaceSelector.matchLabels | nindent 14 }}
      ports:
        - port: {{ .Values.api.httpPort }}
          protocol: TCP

    # Machine-to-machine /api/v1/internal/* callers, on the same port (see note above). An entry
    # with a namespaceSelector matches pods of that namespace; one without, the release namespace.
    {{- range .Values.networkPolicy.allowedCallers }}
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml .podSelector.matchLabels | nindent 14 }}
          {{- with .namespaceSelector }}
          namespaceSelector:
            matchLabels:
              {{- toYaml .matchLabels | nindent 14 }}
          {{- end }}
      ports:
        - port: {{ $.Values.api.httpPort }}
          protocol: TCP
    {{- end }}
    {{- if .Values.connectorWorker.enabled }}
    # The connector worker's task callbacks (connector-tasks routes).
    - from:
        - podSelector:
            matchLabels:
              {{- include "workflow-execution-service.connectorWorkerSelectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.api.httpPort }}
          protocol: TCP
    {{- end }}

    {{- if .Values.networkPolicy.metricsIngress.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.metricsIngress.namespaceSelector.matchLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.metricsIngress.podSelector.matchLabels | nindent 14 }}
      ports:
        - port: {{ .Values.api.metricsPort }}
          protocol: TCP
    {{- end }}

    {{- with .Values.networkPolicy.additionalIngressRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}

  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP
    - ports:
        - port: 5432
          protocol: TCP
        - port: 6432
          protocol: TCP
    - ports:
        - port: 6379
          protocol: TCP
    - ports:
        - port: 4317
          protocol: TCP
    # Temporal frontend (StartWorkflow/SignalWorkflow/QueryWorkflow).
    - ports:
        - port: 7233
          protocol: TCP
    # Named same-namespace egress target: the Definition Service, for the
    # compiled-plan read (LLD §5.3) — not a blanket podSelector: {} allow.
    {{- range .Values.networkPolicy.allowedEgressTargets }}
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml .podSelector.matchLabels | nindent 14 }}
    {{- end }}
    {{- range .Values.networkPolicy.apiIamEgressTargets }}
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml .podSelector.matchLabels | nindent 14 }}
          namespaceSelector:
            matchLabels:
              {{- toYaml .namespaceSelector.matchLabels | nindent 14 }}
      ports:
        {{- range .ports }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    {{- end }}
    {{- $ent := .Values.networkPolicy.entitlementsEgress }}
    {{- if and .Values.env.entitlementsBaseURL $ent $ent.ports $ent.podSelector $ent.podSelector.matchLabels }}
    # Entitlements service (commercial namespace), read for the dedicated_workflow_queue grant.
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.entitlementsEgress.podSelector.matchLabels | nindent 14 }}
          namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.entitlementsEgress.namespaceSelector.matchLabels | nindent 14 }}
      ports:
        {{- range .Values.networkPolicy.entitlementsEgress.ports }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    {{- end }}
    {{- with .Values.networkPolicy.additionalEgressRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
