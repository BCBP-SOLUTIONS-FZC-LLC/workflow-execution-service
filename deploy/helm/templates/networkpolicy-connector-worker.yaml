{{- if and .Values.connectorWorker.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "workflow-execution-service.connectorWorkerFullname" . }}
  labels:
    {{- include "workflow-execution-service.connectorWorkerSelectorLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "workflow-execution-service.connectorWorkerSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress

  ingress:
    {{- if .Values.networkPolicy.metricsIngress.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.metricsIngress.namespaceSelector.matchLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.metricsIngress.podSelector.matchLabels | nindent 14 }}
      ports:
        - port: {{ .Values.connectorWorker.healthPort }}
          protocol: TCP
    {{- end }}

  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 6379
          protocol: TCP
    - ports:
        - port: 4317
          protocol: TCP
    - ports:
        - port: 8080
          protocol: TCP
    - ports:
        - port: 8200
          protocol: TCP
{{- end }}
