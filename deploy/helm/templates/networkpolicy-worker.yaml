# The Worker has no /internal/* route and no public HTTP surface at all —
# its only inbound traffic is Prometheus scraping the health/metrics port;
# work arrives via Temporal task-queue polling (outbound), not inbound calls.
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "workflow-execution-service.workerFullname" . }}
  labels:
    {{- include "workflow-execution-service.workerSelectorLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "workflow-execution-service.workerSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress

  ingress:
    {{- if .Values.networkPolicy.metricsIngress.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.metricsIngress.namespaceSelector.matchLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.metricsIngress.podSelector.matchLabels | nindent 14 }}
      ports:
        - port: {{ .Values.worker.metricsPort }}
          protocol: TCP
    {{- end }}

  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 5432
          protocol: TCP
        - port: 6432
          protocol: TCP
    - ports:
        - port: 4317
          protocol: TCP
    # Temporal frontend (task-queue polling, Activity/Workflow execution).
    - ports:
        - port: 7233
          protocol: TCP
{{- end }}
