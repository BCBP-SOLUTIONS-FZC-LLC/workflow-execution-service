apiVersion: v1
kind: Service
metadata:
  name: {{ include "workflow-execution-service.apiFullname" . }}
  labels:
    {{- include "workflow-execution-service.apiSelectorLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "workflow-execution-service.apiSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.httpPort }}
      targetPort: http
    - name: grpc
      port: {{ .Values.api.grpcPort }}
      targetPort: grpc
