rule_files:
  - app-alerts.yml

evaluation_interval: 1m

tests:
  - name: a purge failure alerts for the sweep interval plus two hours, then clears
    interval: 1h
    input_series:
      - series: 'workflow_execution_service_tenant_purge_failures_total'
        values: '0 1x30'
    alert_rule_test:
      - eval_time: 2h
        alertname: TenantPurgeFailing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              runbook: workflow-execution-service/tenant-purge
              summary: A tenant data purge keeps failing
              description: "An offboarded tenant's rows could not be fully deleted after its retention period; the sweep retries on its next run (LLD §4.13)."
      - eval_time: 25h
        alertname: TenantPurgeFailing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              runbook: workflow-execution-service/tenant-purge
              summary: A tenant data purge keeps failing
              description: "An offboarded tenant's rows could not be fully deleted after its retention period; the sweep retries on its next run (LLD §4.13)."
      - eval_time: 27h
        alertname: TenantPurgeFailing
        exp_alerts: []

  - name: a recorded RLS violation pages at once
    interval: 1m
    input_series:
      - series: 'workflow_execution_service_rls_violations_total{violation_type="cross_tenant_access"}'
        values: '0 0 1 1 1'
    alert_rule_test:
      - eval_time: 1m
        alertname: RLSViolation
        exp_alerts: []
      - eval_time: 3m
        alertname: RLSViolation
        exp_alerts:
          - exp_labels:
              severity: page
              violation_type: cross_tenant_access
            exp_annotations:
              runbook: workflow-execution-service/rls
              summary: "RLS violation recorded: cross_tenant_access"
              description: "Same severity as Definition Service's own RLSMissingGUC/RLSCrossTenantAccess alerts (LLD §9.2, §9.5, §7.6)."

  - name: an instance entering DEGRADED pages
    interval: 1m
    input_series:
      - series: 'workflow_execution_service_instance_degraded_total'
        values: '0 0 1 1 1'
    alert_rule_test:
      - eval_time: 3m
        alertname: InstanceDegraded
        exp_alerts:
          - exp_labels:
              severity: page
            exp_annotations:
              runbook: workflow-execution-service/instance-degraded
              summary: Instance entered DEGRADED
              description: "A parallel-branch failure parked an instance needing admin force-forward/force-back resolution (LLD §3.3, §7.6)."

  - name: no healthy API target alerts after two minutes
    interval: 1m
    input_series:
      - series: 'up{job="workflow-execution-service-api"}'
        values: '1 1 0 0 0 0'
    alert_rule_test:
      - eval_time: 2m
        alertname: ExecutionServiceAPIDown
        exp_alerts: []
      - eval_time: 5m
        alertname: ExecutionServiceAPIDown
        exp_alerts:
          - exp_labels:
              severity: critical
              team: platform
            exp_annotations:
              runbook: workflow-execution-service/api-down
              summary: execution-service API has no healthy instances
              description: "No execution-service API pods have been scraped as healthy for 2 minutes. Check pod readiness: kubectl get pods -l app.kubernetes.io/component=api"

  - name: a connector dead-letter pages at once and names the connector type
    interval: 1m
    input_series:
      - series: 'workflow_execution_service_connector_dispatch_dead_lettered_total{connector_type="rest-call"}'
        values: '0 0 1 1 1'
    alert_rule_test:
      - eval_time: 1m
        alertname: ConnectorDispatchDeadLettered
        exp_alerts: []
      - eval_time: 3m
        alertname: ConnectorDispatchDeadLettered
        exp_alerts:
          - exp_labels:
              severity: page
              connector_type: rest-call
            exp_annotations:
              runbook: workflow-execution-service/connector-dead-letter
              summary: "Connector task entry dead-lettered for rest-call"
              description: "A connector stream entry exceeded its delivery cap, so its task stays open and its instance waits; the worker's callback Warn lines name the status the Execution API answered."

  - name: a queue whose poll timestamp stops advancing pages once it is more than 300 seconds old while a polled queue stays quiet
    interval: 1m
    input_series:
      - series: 'workflow_execution_service_worker_queue_last_poll_timestamp{queue="stalled-queue"}'
        values: '0x30'
      - series: 'workflow_execution_service_worker_queue_last_poll_timestamp{queue="polled-queue"}'
        values: '0+60x30'
    alert_rule_test:
      - eval_time: 5m
        alertname: WorkerQueuePollingStalled
        exp_alerts: []
      - eval_time: 6m
        alertname: WorkerQueuePollingStalled
        exp_alerts:
          - exp_labels:
              severity: page
              queue: stalled-queue
            exp_annotations:
              runbook: workflow-execution-service/queue-polling
              summary: "Queue stalled-queue has not been polled in 5 minutes"
              description: "A Worker silently failing to poll one tenant-isolated queue is invisible to the aggregate workflow_execution_service_worker_active_queues gauge alone (LLD §7.6)."

  - name: instances on a queue with no poll timestamp series page after five minutes
    interval: 1m
    input_series:
      - series: 'workflow_execution_service_instances_by_queue{queue="unpolled-queue"}'
        values: '3x30'
      - series: 'workflow_execution_service_instances_by_queue{queue="polled-queue"}'
        values: '3x30'
      - series: 'workflow_execution_service_worker_queue_last_poll_timestamp{queue="polled-queue"}'
        values: '0+60x30'
      - series: 'workflow_execution_service_instances_by_queue{queue="empty-queue"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 4m
        alertname: InstancesOnUnpolledQueue
        exp_alerts: []
      - eval_time: 5m
        alertname: InstancesOnUnpolledQueue
        exp_alerts:
          - exp_labels:
              severity: page
              queue: unpolled-queue
            exp_annotations:
              runbook: workflow-execution-service/queue-polling
              summary: "Queue unpolled-queue has instances and no Worker polling it"
              description: "A Worker that could not start the worker for a queue only logs, so its instances wait with no task and no other signal (LLD §3.2, §7.6)."

  - name: instances on a queue whose poll timestamp froze page only after it is 300 seconds old and five more minutes have passed
    interval: 1m
    input_series:
      - series: 'workflow_execution_service_instances_by_queue{queue="frozen-queue"}'
        values: '3x40'
      - series: 'workflow_execution_service_worker_queue_last_poll_timestamp{queue="frozen-queue"}'
        values: '0+60x4 240x35'
    alert_rule_test:
      - eval_time: 8m
        alertname: InstancesOnUnpolledQueue
        exp_alerts: []
      - eval_time: 13m
        alertname: InstancesOnUnpolledQueue
        exp_alerts: []
      - eval_time: 15m
        alertname: InstancesOnUnpolledQueue
        exp_alerts:
          - exp_labels:
              severity: page
              queue: frozen-queue
            exp_annotations:
              runbook: workflow-execution-service/queue-polling
              summary: "Queue frozen-queue has instances and no Worker polling it"
              description: "A Worker that could not start the worker for a queue only logs, so its instances wait with no task and no other signal (LLD §3.2, §7.6)."
