version: "2"

sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: db
        out: internal/adapter/outbound/postgres/db
        sql_package: pgx/v5
        emit_json_tags: true
        emit_db_tags: true
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamp
            go_type: time.Time
          - db_type: jsonb
            nullable: true
            go_type: encoding/json.RawMessage
