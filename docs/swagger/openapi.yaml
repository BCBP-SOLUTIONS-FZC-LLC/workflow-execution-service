  /api/v1/instances/{id}/cancel:
    post:
      operationId: cancelInstance
      tags: [Instances]
      summary: Cancel a workflow instance (admin)
      description: >
        Sends a cancel signal to the Temporal workflow. Valid from RUNNING, PAUSED or DEGRADED status.
        The workflow function cleans up active tasks and transitions to TERMINATED. When the
        Temporal workflow execution no longer exists, the instance is marked TERMINATED directly,
        its active tasks are failed, WorkflowInstanceTerminated is emitted instead of
        WorkflowInstanceCancelled, and the request is still answered 202.
      security:
        - GatewayTenantContext: []
          UserContext: []
          AdminRole: []
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/TenantRolesHeader"
        - $ref: "#/components/parameters/InstanceIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason, record_version]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: >
                    Human-readable reason for the cancellation; carried in the
                    WorkflowInstanceCancelled event (WorkflowInstanceTerminated when the
                    workflow execution no longer exists), not stored on the instance.
                    It must contain text: a reason of only whitespace is refused 400 BAD_REQUEST.
                  example: "Superseded by a corrected instance"
                record_version:
                  type: integer
                  minimum: 1
                  description: >
                    The caller's current view of the instance's record_version, checked
                    synchronously before the signal is forwarded (§5.10); required, and at
                    least 1, the lowest version an instance can hold. A body that omits it or
                    carries 0 is refused 400 BAD_REQUEST.
                  example: 2
      responses:
        "202":
          description: Cancel signal accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/InstanceNotFound"
        "409":
          description: >
            State conflict. See code field: INSTANCE_ALREADY_TERMINAL — instance is already in a
            terminal state (COMPLETED, TERMINATED, FAILED);
            RECORD_VERSION_CONFLICT — record_version is stale;
            IDEMPOTENCY_KEY_REPLAY — same key reused with a different request body.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                InstanceAlreadyTerminal:
                  value:
                    type: "https://errors.bcbp.io/execution/instance-already-terminal"
                    title: "Instance Already Terminal"
                    status: 409
                    detail: "instance is already in a terminal state"
                    instance: "/api/v1/instances/3fa85f64-5717-4562-b3fc-2c963f66afa6/cancel"
                    code: "INSTANCE_ALREADY_TERMINAL"
                RecordVersionConflict:
                  value:
                    type: "https://errors.bcbp.io/execution/record-version-conflict"
                    title: "Record Version Conflict"
                    status: 409
                    detail: "record version conflict"
                    instance: "/api/v1/instances/3fa85f64-5717-4562-b3fc-2c963f66afa6/cancel"
                    code: "RECORD_VERSION_CONFLICT"
                IdempotencyReplay:
                  value:
                    type: "https://errors.bcbp.io/execution/idempotency-key-replay"
                    title: "Idempotency Key Replay"
                    status: 409
                    detail: "Idempotency-Key reused with a different request body"
                    instance: "/api/v1/instances/3fa85f64-5717-4562-b3fc-2c963f66afa6/cancel"
                    code: "IDEMPOTENCY_KEY_REPLAY"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/instances/{id}/terminate:
    post:
      operationId: terminateInstance
      tags: [Instances]
      summary: Hard-terminate a workflow instance (admin)
      description: >
        Calls TemporalClient.TerminateWorkflow immediately — does not wait for the current
