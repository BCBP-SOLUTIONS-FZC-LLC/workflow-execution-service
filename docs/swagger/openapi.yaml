openapi: "3.0.3"
info:
  title: Workflow Execution Service
  version: "1.0.0"
  description: >
    Runtime control plane for the BPMN-driven Workflow Engine. Manages workflow instances,
    task projections for dashboard queries, and user signals (claim, complete, defer, reassign).
    All identity and tenant context is injected by the Envoy API Gateway — callers never set
    these headers directly.

servers:
  - url: https://api.internal/execution
    description: Internal API gateway base (service prefix only; paths include /api/v1/)

security:
  - GatewayTenantContext: []
    UserContext: []

tags:
  - name: Ops
    description: Liveness and readiness probes. Prometheus metrics are served on the separate metrics listener, not on this API.
  - name: Instances
    description: >
      Workflow instance lifecycle: start, list, detail, admin signals, node
      overrides, and the activity event log.
  - name: Tasks
    description: >
      Task list/detail and user/admin task actions (claim, complete, defer,
      reassign), including the admin reconciliation query for a user's active
      assignments.

components:
  securitySchemes:
    GatewayTenantContext:
      type: apiKey
      in: header
      name: x-tenant-id
      description: Tenant UUID injected by the API Gateway.
    UserContext:
      type: apiKey
      in: header
      name: x-user-id
      description: Authenticated user UUID injected by the API Gateway.
    AdminRole:
      type: apiKey
      in: header
      name: x-tenant-roles
      description: >
        Comma-separated tenant roles injected by the API Gateway. Admin-only endpoints
        require at least one of: tenant_admin, tenant_owner.
  parameters:
    TenantIdHeader:
      name: x-tenant-id
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Tenant UUID (injected by gateway).
    UserIdHeader:
      name: x-user-id
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Authenticated user UUID (injected by gateway).
    TenantRolesHeader:
      name: x-tenant-roles
      in: header
      required: true
      schema:
        type: string
      description: >
        Comma-separated tenant roles. Must include tenant_admin or tenant_owner
        for admin-only endpoints.
    DepartmentsHeader:
      name: x-departments
      in: header
      required: false
      schema:
        type: string
      description: >
        Comma-separated pairs of department UUID and role, in the form the Definition Service
        design owns (gateway-injected). Execution reads the department half of each pair. An
        entry that is not such a pair grants no department and never fails the request, so a
        malformed header can only narrow what the caller sees.
    PlanHeader:
      name: x-plan
      in: header
      required: false
      schema:
        type: string
        enum: [starter, pro, enterprise]
      description: Tenant plan tier (gateway-injected). The codes are the plan codes of the Catalog Service, the source of truth.
    FeatureFlagsHeader:
      name: x-feature-flags
      in: header
      required: false
      schema:
        type: string
      description: >
        Encoded set of effective feature flags injected by Envoy, matching Definition
        Service's own component (`FeatureFlags`). Defined for documentation parity with the
        standard gateway header set (§1.2); no endpoint in this contract currently gates
        behavior on it.
    RequestIdHeader:
      name: x-request-id
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Optional client-generated request ID for distributed tracing correlation.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: >
        Optional client-supplied key for safe retry of this request. A replay with the same
        key and an identical request body returns the original cached response. A replay with
        the same key and a different body returns 409 IDEMPOTENCY_KEY_REPLAY, as does a
        repeat while the first request under the key is still running (it does not wait; retry
        after the first has finished). A key belongs to the calling user within the tenant:
        another user sending the same key is a separate request.
    InstanceIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Workflow instance UUID.
    TaskIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Workflow task UUID.
    NodeKeyPath:
      name: node
      in: path
      required: true
      schema:
        type: string
      description: >
        BPMN node key in the compiled plan whose assignee is being overridden. A value
        containing a NUL byte or invalid UTF-8 is refused 400 BAD_REQUEST naming node_key.
      example: "review_stage_1"
    CursorQuery:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: >
        Opaque keyset cursor encoding the previous page's last (created_at|occurred_at, id)
        pair (§5.9). Omit for the first page. An unparseable or tampered cursor returns 400
        BAD_REQUEST rather than silently restarting.
    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: >
        Page size. Values above 100 are clamped, not rejected; values <= 0 are rejected
        (§5.9).
    TraceParentHeader:
      name: traceparent
      in: header
      required: false
      schema:
        type: string
      description: >
        W3C Trace Context header (format: 00-{trace-id}-{span-id}-{flags}).
        Injected by the gateway or client to propagate distributed traces.
        Used by TracingMiddleware to link the incoming span to the existing trace.

  schemas:
    InstanceStatus:
      type: string
      enum: [RUNNING, PAUSED, COMPLETED, TERMINATED, FAILED, DEGRADED]
      description: >
        RUNNING: active execution. PAUSED: admin-paused or suspended.
        COMPLETED: all steps finished normally. TERMINATED: admin-terminated or
        graceful-cancelled (Cancel and Terminate share this value). FAILED: unrecoverable
        Temporal error on the main/Sequential path. DEGRADED: a Parallel branch failed
        unrecoverably; siblings keep running, admin resolution required (force-forward,
        force-back, or cancel/terminate).

    TaskStatus:
      type: string
      enum: [READY, IN_PROGRESS, COMPLETED, DEFERRED, FAILED, SUPERSEDED]
      description: >
        READY and IN_PROGRESS: the task is open; every action that accepts one accepts the
        other, and a claim changes neither. COMPLETED: the lead's completion closed the other open assignments
        and the instance moved on.
        DEFERRED: the assignee sent the instance one step back; the earlier step's task is created when its department runs again.
        FAILED: swept up in an instance-cancel/-terminate/FAILED cascade — never an
        independent per-task failure. SUPERSEDED: bypassed by an admin instance-force-forward.

    AssigneeMode:
      type: string
      enum: [single, all]
      description: >
        single: the first user to claim and complete the task satisfies it.
        all: every assigned user must complete their assignment before the task advances.

    OverrideMap:
      type: object
      description: >
        Maps BPMN node keys to user UUIDs to override the default assignee from the
        compiled plan. For assignee_mode=all nodes, this replaces the slot at index 0 only.
        Keys must match node keys in the compiled plan; values must be valid UUIDs.
      additionalProperties:
        type: string
        format: uuid
      example:
        review_stage_1: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        approval_stage: "7c9e6679-7425-40de-944b-e07fc1f90ae7"

    SignalAccepted:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: "signal accepted"

    WorkflowEventType:
      type: string
      enum:
        - INSTANCE_STARTED
        - INSTANCE_PAUSED
        - INSTANCE_RESUMED
        - INSTANCE_COMPLETED
        - INSTANCE_TERMINATED
        - INSTANCE_FAILED
        - TASK_CREATED
        - TASK_ASSIGNED
        - TASK_STARTED
        - TASK_COMPLETED
        - TASK_DEFERRED
        - TASK_REJECTED
        - TASK_REASSIGNED
        - INSTANCE_CANCELLED
        - INSTANCE_DEGRADED
        - INSTANCE_FORCE_ROUTED
        - TASK_CLAIMED
        - TASK_SUPERSEDED
        - TASK_FAILED
        - TASK_SLA_WARNING
        - TASK_SLA_BREACHED
        # COMMENT_ADDED / RESOURCE_LINKED: currently unused — workflow_comment/workflow_resource_link
        # are tentatively removed from scope pending confirmation (see open_questions.md). Kept here,
        # not deleted, in case the removal is reversed.
        - COMMENT_ADDED
        - RESOURCE_LINKED
      description: >
        Activity event type. The log returns every event type of the outbound catalogue (§6.4),
        named in upper snake case, a finished instance being reported as INSTANCE_COMPLETED:
        instance started, paused, resumed, cancelled, terminated, degraded, failed, completed and
        force-routed; task created, claimed, completed, deferred, reassigned, superseded, failed,
        SLA warning and SLA breached. TASK_REJECTED, COMMENT_ADDED and RESOURCE_LINKED are
        reserved for features out of scope and are never emitted; deferral emits TASK_DEFERRED.
        OUTBOX_SENT is an internal platform concern and is never returned.

    WorkflowEvent:
      type: object
      required: [id, workflow_instance_id, tenant_id, event_type, occurred_at]
      properties:
        id:
          type: string
          format: uuid
        workflow_instance_id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
          nullable: true
          description: Set for task-scoped events; null for instance-level events.
        tenant_id:
          type: string
          format: uuid
        event_type:
          $ref: "#/components/schemas/WorkflowEventType"
        actor_user_id:
          type: string
          format: uuid
          nullable: true
          description: The user who triggered the event. Null for system/SQS-initiated transitions.
        node_key:
          type: string
          nullable: true
          description: BPMN node key for task-scoped events.
          example: "review_stage_1"
        payload_json:
          type: object
          additionalProperties: true
          description: Event-specific context (e.g. reason, new_user_id).
        occurred_at:
          type: string
          format: date-time

    InstanceSummary:
      type: object
      required:
        - id
        - tenant_id
        - workflow_id
        - workflow_version_id
        - subject_id
        - business_key
        - status
        - started_by_user_id
        - started_at
        - record_version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        workflow_id:
          type: string
          format: uuid
          description: >
            UUID of the parent workflow record in the Definition Service.
            Snapshotted from the Definition Service's compiled-plan read at instance creation; immutable.
        subject_id:
          type: string
          description: >
            Caller-supplied identifier of the entity this instance is about, opaque to the
            engine. One subject holds as many concurrent instances as it has distinct
            business keys.
          example: "tender-abc-001"
        business_key:
          type: string
          description: >
            Caller-supplied key identifying this instance within its subject; the pair is
            unique per tenant among instances that are not COMPLETED, TERMINATED or FAILED,
            which includes RUNNING, PAUSED and DEGRADED.
          example: "stage-prequalification"
        workflow_version_id:
          type: string
          format: uuid
          description: Pinned at instance creation; immutable.
        temporal_workflow_id:
          type: string
          description: Temporal workflow id of this instance's execution, `tenant:<tenant id>:instance:<instance id>`. It is unique per instance, so a reused subject_id and business_key never shares an execution with an earlier instance. A row keeps the value stored when the instance started.
        current_node_keys:
          type: array
          items:
            type: string
          description: >
            Active BPMN node keys. Contains more than one entry during parallel gateway steps.
            Empty when the instance has reached a terminal state.
          example: ["review_stage_1"]
        saved_node_keys:
          type: array
          items:
            type: string
          description: >
            Sibling branch(es) saved by a force-forward skip, restorable by force-back.
            Empty when no branch is saved.
        status:
          $ref: "#/components/schemas/InstanceStatus"
        started_by_user_id:
          type: string
          format: uuid
        started_at:
          type: string
          format: date-time
          description: The instant the instance row was created at start.
        completed_at:
          type: string
          format: date-time
          nullable: true
        record_version:
          type: integer
          format: int64
          description: >
            Optimistic-lock token. Required in every lifecycle-signal request body
            (pause/resume/cancel/force-forward/force-back) — this is the only
            documented way a client learns the current value.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    InstanceDetail:
      allOf:
        - $ref: "#/components/schemas/InstanceSummary"
        - type: object
          properties:
            tasks:
              type: array
              items:
                $ref: "#/components/schemas/TaskSummary"
              description: All tasks created for this instance (current and historical).
            has_context:
              type: boolean
              description: >
                True if a context_json was provided at instance creation. The context
                payload itself is not returned here to avoid leaking tender/document
                data to callers who only need the workflow state.
            override_map:
              allOf:
                - $ref: "#/components/schemas/OverrideMap"
              nullable: true
              description: Instantiation-time non-default-assignee map; null if none was supplied at start.

    TaskFields:
      type: object
      description: The task fields shared by the read answers (TaskSummary) and the task-action answers (TaskActionResult).
      required:
        - id
        - workflow_instance_id
        - tenant_id
        - node_key
        - task_type
        - department_id
        - status
        - record_version
        - assignee_mode
        - created_at
      properties:
        id:
          type: string
          format: uuid
        workflow_instance_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        node_key:
          type: string
          description: BPMN node ID matching the compiled plan.
          example: "review_stage_1"
        task_type:
          type: string
          example: "userTask"
        department_id:
          type: string
          format: uuid
          description: Snapshotted from the compiled plan at task creation.
        status:
          $ref: "#/components/schemas/TaskStatus"
        record_version:
          type: integer
          description: >
            Optimistic lock counter. Incremented on every Claim or assignment change.
            Clients must echo the record_version they last observed in mutation requests.
          example: 2
        assignee_mode:
          $ref: "#/components/schemas/AssigneeMode"
        assignee_count:
          type: integer
          description: >
            Expected number of active assignments for this task. Left out of the answer to a
            claim, complete, defer or reassign whose count could not be read after the action
            took effect; the action itself succeeded.
          example: 2
        due_at:
          type: string
          format: date-time
          nullable: true
          description: SLA deadline snapshotted from the compiled plan at task creation.
        deferred_from_task_id:
          type: string
          format: uuid
          nullable: true
          description: Legacy. A defer no longer creates a task, so nothing sets this.
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true

    TaskSummary:
      description: A task as the list, detail and instance reads answer it; assignee_count is always present.
      allOf:
        - $ref: "#/components/schemas/TaskFields"
        - type: object
          required:
            - assignee_count

    TaskActionResult:
      description: A task as a claim, complete, defer or reassign answers it; assignee_count is left out when its read failed after the action took effect.
      allOf:
        - $ref: "#/components/schemas/TaskFields"

    TaskDetail:
      allOf:
        - $ref: "#/components/schemas/TaskSummary"
        - type: object
          properties:
            payload_json:
              type: object
              description: >
                Runtime context passed from the instance start request at task creation.
                Read-only; matches the context_json provided when the instance was started.
                For a connector task, resolved_inputs and output_mapping are included only for
                callers holding tenant_admin or tenant_owner; every other reader of the task
                gets the rest of the payload without them.
              additionalProperties: true
            assignments:
              type: array
              items:
                $ref: "#/components/schemas/AssignmentRecord"
              description: All assignment records for this task (active and historical).

    AssignmentRecord:
      type: object
      required:
        - id
        - user_id
        - is_lead
        - assigned_at
        - is_active
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        is_lead:
          type: boolean
          description: >
            True for the assignment that established claim precedence under
            assignee_mode=all — the one user whose claim/complete drives the task
            forward among multiple assignees.
        assigned_by:
          type: string
          format: uuid
          nullable: true
          description: User ID of the assigner. Null if the system auto-assigned from the compiled plan.
        reason:
          type: string
          nullable: true
          description: >
            Human-readable reason for this assignment. Examples: "compiled plan default",
            "admin reassignment", "delegation:uuid", "delegation_ended".
          example: "compiled plan default"
        assigned_at:
          type: string
          format: date-time
        claimed_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        result_json:
          type: object
          nullable: true
          additionalProperties: true
          description: Completion payload submitted by this assignee. Null until completed.
        vacated_at:
          type: string
          format: date-time
          nullable: true
          description: Set when this assignment is superseded (reassignment, delegation shift).
        is_active:
          type: boolean
          description: False once vacated. Historical rows are preserved for audit.

    OverrideResult:
      type: object
      description: The persisted node-override record (rev 1.23 — matches overrideNodeAssignee's actual 200 response, not a SignalAccepted body).
      required:
        - workflow_instance_id
        - node_key
        - previous_user_id
        - new_user_id
        - actor_user_id
        - record_version
      properties:
        workflow_instance_id:
          type: string
          format: uuid
        node_key:
          type: string
          example: "review_stage_1"
        previous_user_id:
          type: string
          format: uuid
          nullable: true
          description: >
            The user the node was taken from (the lead on a multi-assignee task). Null when no
            one is replaced: a task with no active assignee, or a multi-assignee task with no
            lead yet, where the new user is added beside the current assignees.
        new_user_id:
          type: string
          format: uuid
        reason:
          type: string
          nullable: true
        actor_user_id:
          type: string
          format: uuid
        record_version:
          type: integer
          description: >
            The task's record_version once the override is stored (the request's version plus
            one). The workflow bumps it again when it applies the move, so read the task before
            the next action on it.

    ActiveUserTask:
      type: object
      required:
        - task_id
        - workflow_instance_id
        - node_key
        - user_id
        - department_id
        - status
        - record_version
      properties:
        task_id:
          type: string
          format: uuid
        workflow_instance_id:
          type: string
          format: uuid
        node_key:
          type: string
          example: "eng/Review_Task"
        user_id:
          type: string
          format: uuid
          description: The user whose active assignment this is.
        department_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/TaskStatus"
        record_version:
          type: integer
          format: int64

    OutsideAnswer:
      type: object
      additionalProperties: false
      description: An outside party's answer or message, delivered by the service that deals with it.
      properties:
        variables:
          type: object
          description: Merged into the instance's variables; a key already set is replaced.
          additionalProperties: true
          example: { bid: "42" }

    GatewayAuthError:
      type: object
      required: [error, status]
      description: The flat envelope the shared HTTP library writes before a handler runs (a missing identity, a request that outlived the request timeout, answered 503 after the handler returns, a recovered panic).
      properties:
        error:      { type: string, example: "missing or invalid authentication headers" }
        status:     { type: integer, example: 401 }
        trace_id:   { type: string }
        request_id: { type: string }

    ProblemDetails:
      type: object
      required: [type, title, status, detail, instance, code]
      properties:
        type:
          type: string
          format: uri
          description: >
            URI reference identifying the problem type.
            Format: https://errors.bcbp.io/execution/{kebab-code}
          example: "https://errors.bcbp.io/execution/task-concurrency-violation"
        title:
          type: string
          description: Short, human-readable problem title (invariant per error type).
          example: "Task Concurrency Violation"
        status:
          type: integer
          description: HTTP status code.
          example: 409
        detail:
          type: string
          description: Human-readable explanation of this specific occurrence.
          example: "record version conflict"
        instance:
          type: string
          format: uri-reference
          description: URI reference identifying the specific request that produced the error.
          example: "/api/v1/tasks/3fa85f64-5717-4562-b3fc-2c963f66afa6/claim"
        code:
          type: string
          description: >
            Machine-readable error code (stable across releases). One of:
            BAD_REQUEST, UNAUTHORIZED, FORBIDDEN, NOT_ASSIGNEE, NOT_AUTHORIZED_FOR_RESOURCE,
            TENANT_MISMATCH, NOT_FOUND, INSTANCE_NOT_FOUND, TASK_NOT_FOUND,
            VERSION_NOT_FOUND, TARGET_NODE_NOT_FOUND, WAIT_NOT_FOUND, NOT_WAITING, OVERRIDE_NO_OP, DUPLICATE_BUSINESS_KEY,
            TENANT_NOT_ACTIVE, VERSION_NOT_PUBLISHED, VERSION_INVALID,
            RECORD_VERSION_CONFLICT, INSTANCE_ALREADY_TERMINAL, INVALID_INSTANCE_STATE,
            TASK_ALREADY_CLAIMED, CLAIM_NOT_APPLICABLE, INVALID_TASK_STATE,
            FORCE_BACK_NO_SAVED_BRANCH, NODE_ALREADY_RESOLVED, IDEMPOTENCY_KEY_REPLAY,
            ASSIGNEE_INELIGIBLE, OVERRIDE_MAP_INVALID, PAYLOAD_TOO_LARGE, UNSUPPORTED_MEDIA_TYPE,
            UPSTREAM_UNAVAILABLE, EVENT_DECODE_FAILED, METHOD_NOT_ALLOWED, INTERNAL_ERROR.
            METHOD_NOT_ALLOWED is the 405 answer for a path that exists under other methods only;
            the Allow header lists those methods.
          example: "RECORD_VERSION_CONFLICT"
        trace_id:
          type: string
          description: The OpenTelemetry trace id of the request, equal to the X-Trace-ID response header.
        request_id:
          type: string
          description: The request id, equal to the X-Request-ID response header.
        invalid_params:
          type: array
          description: >
            Present on validation errors carrying more than one offending field/node — one entry
            per violation (e.g. ASSIGNEE_INELIGIBLE's bulk node-eligibility failures, §5.5, or a
            request body field the endpoint does not define, reason "is not a known field").
            Absent (omitted entirely, not null) on every other error.
          items:
            type: object
            required: [name, reason]
            properties:
              name:
                type: string
                description: Name of the invalid field, query/path parameter, or node key.
                example: "review_finance"
              reason:
                type: string
                description: Human-readable explanation of why this entry is invalid.
                example: "user no longer holds required_level=approver in department_id=9b1c...finance"
              code:
                type: string
                description: Optional machine-readable sub-code for this specific violation.

  responses:
    BadRequest:
      description: >
        Malformed JSON body, missing required fields, or a value that is not valid, such as an
        id that is not a UUID in the body, a query parameter or the path. invalid_params names
        the field (a path parameter as one) with the reason "is not valid".
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: "https://errors.bcbp.io/execution/bad-request"
            title: "Bad Request"
            status: 400
            detail: "request body has missing or invalid fields"
            instance: "/api/v1/tasks/3fa85f64-5717-4562-b3fc-2c963f66afa6/claim"
            code: "BAD_REQUEST"

    Unauthorized:
      description: >
        Missing or invalid x-tenant-id / x-user-id gateway headers. A missing identity is refused
        by the shared HTTP library with `GatewayAuthError`; an identity that is present but not
        acceptable is refused with a problem document.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: "https://errors.bcbp.io/execution/unauthorized"
            title: "Unauthorized"
            status: 401
            detail: "missing or invalid authentication headers"
            instance: "/api/v1/instances"
            code: "UNAUTHORIZED"
        application/json:
          schema:
            $ref: "#/components/schemas/GatewayAuthError"

    Forbidden:
      description: Caller lacks the required role or active assignment for this resource.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: "https://errors.bcbp.io/execution/not-assignee"
            title: "Not Assigned"
            status: 403
            detail: "caller is not the task's active assignee"
            instance: "/api/v1/tasks/3fa85f64-5717-4562-b3fc-2c963f66afa6/claim"
            code: "NOT_ASSIGNEE"

    InstanceNotFound:
      description: Workflow instance not found or belongs to a different tenant.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: "https://errors.bcbp.io/execution/instance-not-found"
            title: "Instance Not Found"
            status: 404
            detail: "instance not found"
            instance: "/api/v1/instances/3fa85f64-5717-4562-b3fc-2c963f66afa6"
            code: "INSTANCE_NOT_FOUND"

    TaskNotFound:
      description: Workflow task not found or belongs to a different tenant.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: "https://errors.bcbp.io/execution/task-not-found"
            title: "Task Not Found"
            status: 404
            detail: "task not found"
            instance: "/api/v1/tasks/3fa85f64-5717-4562-b3fc-2c963f66afa6"
            code: "TASK_NOT_FOUND"

    PayloadTooLarge:
      description: Request body exceeds the 10 MB limit (§5.10, §9.3 — same cap Definition Service applies).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: "https://errors.bcbp.io/execution/payload-too-large"
            title: "Payload Too Large"
            status: 413
            detail: "request body exceeds the 10 MB limit"
            instance: "/api/v1/instances"
            code: "PAYLOAD_TOO_LARGE"

    UnsupportedMediaType:
      description: Request Content-Type is not application/json (parameters such as charset are accepted; a request with no Content-Type is read as JSON).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: "https://errors.bcbp.io/execution/unsupported-media-type"
            title: "Unsupported Media Type"
            status: 415
            detail: "request body must be application/json"
            instance: "/api/v1/instances"
            code: "UNSUPPORTED_MEDIA_TYPE"

    InternalError:
      description: Unhandled server error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: "https://errors.bcbp.io/execution/internal-error"
            title: "Internal Server Error"
            status: 500
            detail: "an unexpected error occurred"
            instance: "/api/v1/instances"
            code: "INTERNAL_ERROR"

    ServiceUnavailable:
      description: >
        An upstream dependency (the workflow engine or the Definition Service) could not serve the request.
        The detail is fixed and carries no text of the failed call; the same request can be sent again.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: "https://errors.bcbp.io/execution/upstream-unavailable"
            title: "Service Unavailable"
            status: 503
            detail: "the workflow engine could not take the request; retry it"
            instance: "/api/v1/instances"
            code: "UPSTREAM_UNAVAILABLE"

paths:
  /healthz:
    get:
      tags: [Ops]
      summary: Liveness probe
      description: Returns 200 while the process is alive. No dependency checks. Served at the root, outside the `/api/v1` prefix.
      security: []
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
    head:
      tags: [Ops]
      summary: Liveness probe, status only
      description: Answers the same status as GET; the response has no body.
      security: []
      responses:
        "200":
          description: Process is alive.

  /readyz:
    get:
      tags: [Ops]
      summary: Readiness probe
      description: >
        Returns 200 while the database and the Temporal frontend answer. An unreachable cache does not
        remove the service from rotation: the body reports `cache: degraded` and the status stays 200.
        Once the process has been told to stop, it answers 503 with `shutting_down: true` while it drains,
        before it closes its listener. Served at the root, outside the `/api/v1` prefix.
      security: []
      responses:
        "200":
          description: Service is ready.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: "OK"
                  db_utilization:
                    type: number
                    example: 0.3
                    description: Ratio of acquired connections to the pool maximum.
                  db_conns:
                    type: integer
                    example: 3
                    description: Acquired connections.
                  db_max_conns:
                    type: integer
                    example: 10
                    description: Configured pool maximum.
                  cache:
                    type: string
                    enum: [degraded]
                    description: Present only while the cache does not answer; the service keeps serving without it.
        "503":
          description: A dependency is unreachable, or the process is shutting down; the first failing check is named.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [unavailable]
                  db:
                    type: string
                    enum: [unreachable]
                  temporal:
                    type: string
                    enum: [unreachable]
                  shutting_down:
                    type: boolean
                    enum: [true]
              example:
                status: unavailable
                temporal: unreachable
    head:
      tags: [Ops]
      summary: Readiness probe, status only
      description: Runs the same checks as GET and answers the same status; the response has no body.
      security: []
      responses:
        "200":
          description: Service is ready.
        "503":
          description: A dependency is unreachable, or the process is shutting down.

  /api/v1/instances:
    post:
      operationId: startInstance
      tags: [Instances]
      summary: Start a new workflow instance
      description: >
        Validates that the referenced version is PUBLISHED and is_valid=true, then starts
        a Temporal workflow execution and inserts the instance record transactionally.
        Returns 409 if an instance that is not COMPLETED, TERMINATED or FAILED (RUNNING,
        PAUSED or DEGRADED) with the same subject_id and business_key already exists for
        this tenant. A value that is not a UUID in workflow_version_id or in override_map is
        400 BAD_REQUEST naming the field in invalid_params. A workflow_version_id that does not
        exist for the caller's tenant, including one that belongs to another tenant, is
        404 VERSION_NOT_FOUND, the same answer for both. A failure to read the compiled plan
        from the Definition Service other than not-found, and a workflow that cannot be
        started after the service's retries, are 503 UPSTREAM_UNAVAILABLE with a fixed detail
        that carries no error text of the failed call; the instance row stays committed and
        the same request sent again completes the start. A published, valid version whose plan
        cannot be expanded, cannot be decoded, names no main plan or names a department whose iam_department_id is not a UUID is 409 VERSION_INVALID. A start whose execution is held by an open execution of a different
        instance is 409 DUPLICATE_BUSINESS_KEY.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/PlanHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/TraceParentHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [subject_id, business_key, workflow_version_id]
              properties:
                subject_id:
                  type: string
                  minLength: 2
                  maxLength: 64
                  description: >
                    The entity this run is about, opaque to the engine. Addressable on its
                    own: it is what a subject-scoped delegation resolves against and what
                    GET /instances?subject_id= filters on. A tender-scoped delegation matches
                    only when subject_id is a UUID (compared by value, not by text).
                  example: "3f2504e0-4f89-41d3-9a0c-0305e82c3301"
                business_key:
                  type: string
                  minLength: 2
                  maxLength: 64
                  description: >
                    Caller-supplied key for this run within its subject. The pair must be
                    unique for this tenant among instances that are not COMPLETED, TERMINATED
                    or FAILED, which includes RUNNING, PAUSED and DEGRADED. A caller
                    running one instance per subject sets this to a constant of its own
                    choosing.
                  example: "stage-prequalification"
                workflow_version_id:
                  type: string
                  format: uuid
                  description: Must reference a PUBLISHED version with is_valid=true.
                context_json:
                  type: object
                  additionalProperties: true
                  description: >
                    Optional runtime data attached to this instance (e.g. tender_id, document refs).
                    Immutable after creation; passed to all tasks created for this instance.
                override_map:
                  $ref: "#/components/schemas/OverrideMap"
      responses:
        "201":
          description: Instance created and Temporal workflow started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >
            VERSION_NOT_FOUND — the Definition Service has no workflow version with this
            workflow_version_id for the caller's tenant. A version that belongs to another
            tenant gets the same answer.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: "https://errors.bcbp.io/execution/version-not-found"
                title: "Version Not Found"
                status: 404
                detail: "workflow version not found"
                instance: "/api/v1/instances"
                code: "VERSION_NOT_FOUND"
        "409":
          description: >
            State conflict. See code field:
            IDEMPOTENCY_KEY_REPLAY — same key reused with a different request body;
            DUPLICATE_BUSINESS_KEY — a live instance (not COMPLETED, TERMINATED or FAILED, so RUNNING, PAUSED or DEGRADED) for this subject_id and business_key already exists and is not this caller's own unfinished start (a RUNNING instance of the same version started by the same caller with the same context_json and override_map is the same start sent again and is returned with 201), or the start's workflow execution is held by an open execution of a different instance;
            TENANT_NOT_ACTIVE — the tenant is offboarded, or its recorded status is one the service is configured to refuse starts for (no other status by default);
            VERSION_NOT_PUBLISHED — the referenced version is DRAFT or ARCHIVED;
            VERSION_INVALID — version.is_valid=false (assignee eligibility was revoked), or the compiled plan has a schema version this service does not read, is not valid JSON, names no main plan, names a department whose iam_department_id is not a UUID, or cannot be expanded.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                DuplicateBusinessKey:
                  value:
                    type: "https://errors.bcbp.io/execution/duplicate-business-key"
                    title: "Duplicate Business Key"
                    status: 409
                    detail: "business key already active for this subject"
                    instance: "/api/v1/instances"
                    code: "DUPLICATE_BUSINESS_KEY"
                TenantNotActive:
                  value:
                    type: "https://errors.bcbp.io/execution/tenant-not-active"
                    title: "Tenant Not Active"
                    status: 409
                    detail: "the tenant's status does not allow starting an instance"
                    instance: "/api/v1/instances"
                    code: "TENANT_NOT_ACTIVE"
                VersionNotPublished:
                  value:
                    type: "https://errors.bcbp.io/execution/version-not-published"
                    title: "Version Not Published"
                    status: 409
                    detail: "workflow version is not published"
                    instance: "/api/v1/instances"
                    code: "VERSION_NOT_PUBLISHED"
                VersionInvalid:
                  value:
                    type: "https://errors.bcbp.io/execution/version-invalid"
                    title: "Version Invalid"
                    status: 409
                    detail: "workflow version is not valid"
                    instance: "/api/v1/instances"
                    code: "VERSION_INVALID"
                IdempotencyReplay:
                  value:
                    type: "https://errors.bcbp.io/execution/idempotency-key-replay"
                    title: "Idempotency Key Replay"
                    status: 409
                    detail: "Idempotency-Key reused with a different request body"
                    instance: "/api/v1/instances"
                    code: "IDEMPOTENCY_KEY_REPLAY"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          description: >
            See code field: OVERRIDE_MAP_INVALID — override_map contains a node key that is not
            in the compiled plan (a value that is not a UUID is a 400 BAD_REQUEST naming the
            entry in invalid_params, not this code); ASSIGNEE_INELIGIBLE — a default assignee no
            longer satisfies their node's (department, level) eligibility requirement (§5.5).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                OverrideMapInvalid:
                  value:
                    type: "https://errors.bcbp.io/execution/override-map-invalid"
                    title: "Override Map Invalid"
                    status: 422
                    detail: "override_map references an unknown node key or invalid value: node key \"unknown_stage\""
                    instance: "/api/v1/instances"
                    code: "OVERRIDE_MAP_INVALID"
                AssigneeIneligible:
                  value:
                    type: "https://errors.bcbp.io/execution/assignee-ineligible"
                    title: "Assignee Ineligible"
                    status: 422
                    detail: "the assignee of one or more nodes does not satisfy the node's eligibility requirement"
                    instance: "/api/v1/instances"
                    code: "ASSIGNEE_INELIGIBLE"
                    invalid_params:
                      - name: "review_finance"
                        reason: "user no longer holds required_level=approver in department_id=9b1c...finance"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: >
            UPSTREAM_UNAVAILABLE — the compiled-plan read from the Definition Service failed
            for any reason other than not-found (the Definition Service unreachable, a server
            error, a refusal, an answer that breaks the contract), or the workflow could not
            be started after the service's retries. The detail is fixed and carries no error
            text of the failed call, and the problem type does not name Temporal. For a
            workflow that could not be started, the instance row stays committed and the same
            request sent again completes the start.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

    get:
      operationId: listInstances
      tags: [Instances]
      summary: List workflow instances
      description: >
        Returns a paginated list of instances for the caller's tenant, additionally scoped to
        the same assignee/department/admin visibility rule as GET /instances/:id (§9.2) —
        non-visible instances are simply absent from the page, not an error. A filter parameter sent with an
        empty value is treated as not sent.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/LimitQuery"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/InstanceStatus"
          description: Filter by instance status.
        - name: subject_id
          in: query
          required: false
          schema:
            type: string
          description: >
            Filter to one subject's instances. Combined with status, this is how a calling
            domain reads back the runs it currently has live for one of its own entities.
            Composes with the department/assignee scoping every list read already applies.
        - name: workflow_version_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter to a specific compiled version.
        - name: started_after
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Include only instances started after this timestamp (inclusive).
        - name: started_before
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Include only instances started before this timestamp (exclusive).
      responses:
        "200":
          description: Keyset page of workflow instances (§5.9).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/InstanceSummary"
                  next_cursor:
                    type: string
                    nullable: true
                    description: Opaque cursor for the next page; omitted/null on the final page.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/instances/{id}:
    get:
      operationId: getInstance
      tags: [Instances]
      summary: Get workflow instance detail
      description: >
        Returns instance detail including all tasks created for this instance. Visible only
        if the caller holds an active assignment on any task under this instance, the caller's
        x-departments includes the department_id of any task of the instance (open or closed),
        or the caller holds tenant_admin/tenant_owner (§9.2). A caller who held a task earlier
        but holds no active assignment now reads the instance only through department
        membership or an admin role. Returns 403 NOT_AUTHORIZED_FOR_RESOURCE otherwise —
        not 404, since the instance is already confirmed to exist in the caller's own tenant.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/TenantRolesHeader"
        - $ref: "#/components/parameters/DepartmentsHeader"
        - $ref: "#/components/parameters/InstanceIdPath"
      responses:
        "200":
          description: Workflow instance detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            NOT_AUTHORIZED_FOR_RESOURCE — caller holds no active assignment on a task of the
            instance, has no department of any task of the instance, and is not an admin.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: "https://errors.bcbp.io/execution/not-authorized-for-resource"
                title: "Not Authorized For Resource"
                status: 403
                detail: "caller is not authorized to read this resource"
                instance: "/api/v1/instances/3fa85f64-5717-4562-b3fc-2c963f66afa6"
                code: "NOT_AUTHORIZED_FOR_RESOURCE"
        "404":
          $ref: "#/components/responses/InstanceNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/instances/{id}/pause:
    post:
      operationId: pauseInstance
      tags: [Instances]
      summary: Pause a running workflow instance (admin)
      description: >
        Sends a pause signal to the Temporal workflow. A RUNNING instance transitions to
        PAUSED. A DEGRADED instance keeps its status and the pause is held until the
        park ends, which then leaves the instance PAUSED. Returns 409 if the instance
        is neither RUNNING nor DEGRADED.
      security:
        - GatewayTenantContext: []
          UserContext: []
          AdminRole: []
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/TenantRolesHeader"
        - $ref: "#/components/parameters/InstanceIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [record_version]
              properties:
                record_version:
                  type: integer
                  minimum: 1
                  description: >
                    The caller's current view of the instance's record_version, checked
                    synchronously before the signal is forwarded (§5.10); required, and at
                    least 1, the lowest version an instance can hold. A body that omits it or
                    carries 0 is refused 400 BAD_REQUEST.
                  example: 3
                reason:
                  type: string
                  maxLength: 500
                  nullable: true
                  description: Optional human-readable reason for the pause.
      responses:
        "202":
          description: Pause signal accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/InstanceNotFound"
        "409":
          description: >
            State conflict. See code field: INVALID_INSTANCE_STATE — instance is neither RUNNING nor DEGRADED;
            RECORD_VERSION_CONFLICT — record_version is stale;
            IDEMPOTENCY_KEY_REPLAY — same key reused with a different request body.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                InstanceStateInvalid:
                  value:
                    type: "https://errors.bcbp.io/execution/invalid-instance-state"
                    title: "Invalid Instance State"
                    status: 409
                    detail: "action not valid for instance's current status"
                    instance: "/api/v1/instances/3fa85f64-5717-4562-b3fc-2c963f66afa6/pause"
                    code: "INVALID_INSTANCE_STATE"
                RecordVersionConflict:
                  value:
                    type: "https://errors.bcbp.io/execution/record-version-conflict"
                    title: "Record Version Conflict"
                    status: 409
                    detail: "record version conflict"
                    instance: "/api/v1/instances/3fa85f64-5717-4562-b3fc-2c963f66afa6/pause"
                    code: "RECORD_VERSION_CONFLICT"
                IdempotencyReplay:
                  value:
                    type: "https://errors.bcbp.io/execution/idempotency-key-replay"
                    title: "Idempotency Key Replay"
                    status: 409
                    detail: "Idempotency-Key reused with a different request body"
                    instance: "/api/v1/instances/3fa85f64-5717-4562-b3fc-2c963f66afa6/pause"
                    code: "IDEMPOTENCY_KEY_REPLAY"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/instances/{id}/resume:
    post:
      operationId: resumeInstance
      tags: [Instances]
      summary: Resume a paused workflow instance (admin)
      description: >
        Sends a resume signal to the Temporal workflow. A PAUSED instance transitions to
        RUNNING. On a DEGRADED instance the resume clears a pause held for the park, under
        the same initiator rule, and is dropped when none is held. Returns 409 if the
        instance is neither PAUSED nor DEGRADED.
      security:
        - GatewayTenantContext: []
          UserContext: []
          AdminRole: []
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/TenantRolesHeader"
        - $ref: "#/components/parameters/InstanceIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [record_version]
              properties:
                record_version:
                  type: integer
                  minimum: 1
                  description: >
                    The caller's current view of the instance's record_version, checked
                    synchronously before the signal is forwarded (§5.10); required, and at
                    least 1, the lowest version an instance can hold. A body that omits it or
                    carries 0 is refused 400 BAD_REQUEST.
                  example: 4
      responses:
        "202":
          description: Resume signal accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/InstanceNotFound"
        "409":
          description: >
            State conflict. See code field: INVALID_INSTANCE_STATE — instance is neither PAUSED nor DEGRADED;
            RECORD_VERSION_CONFLICT — record_version is stale;
            IDEMPOTENCY_KEY_REPLAY — same key reused with a different request body.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                InstanceStateInvalid:
                  value:
                    type: "https://errors.bcbp.io/execution/invalid-instance-state"
                    title: "Invalid Instance State"
                    status: 409
                    detail: "action not valid for instance's current status"
                    instance: "/api/v1/instances/3fa85f64-5717-4562-b3fc-2c963f66afa6/resume"
                    code: "INVALID_INSTANCE_STATE"
                RecordVersionConflict:
                  value:
                    type: "https://errors.bcbp.io/execution/record-version-conflict"
                    title: "Record Version Conflict"
                    status: 409
                    detail: "record version conflict"
                    instance: "/api/v1/instances/3fa85f64-5717-4562-b3fc-2c963f66afa6/resume"
                    code: "RECORD_VERSION_CONFLICT"
                IdempotencyReplay:
                  value:
                    type: "https://errors.bcbp.io/execution/idempotency-key-replay"
                    title: "Idempotency Key Replay"
                    status: 409
