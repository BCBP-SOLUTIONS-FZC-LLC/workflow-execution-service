  /api/v1/instances/{id}/cancel:
    post:
      operationId: cancelInstance
      tags: [Instances]
      summary: Cancel a workflow instance (admin)
      description: >
        Sends a cancel signal to the Temporal workflow. Valid from RUNNING or PAUSED status.
        The workflow function cleans up active tasks and transitions to TERMINATED.
      security:
        - GatewayTenantContext: []
          UserContext: []
          AdminRole: []
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/TenantRolesHeader"
        - $ref: "#/components/parameters/InstanceIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, record_version]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: Human-readable reason for the cancellation; stored on the instance record.
                  example: "Superseded by a corrected instance"
                record_version:
                  type: integer
                  description: >
                    The caller's current view of the instance's record_version, checked
                    synchronously before the signal is forwarded (§5.10).
                  example: 2
      responses:
        "202":
          description: Cancel signal accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/InstanceNotFound"
        "409":
          description: >
            State conflict. See code field: INSTANCE_ALREADY_TERMINAL — instance is already in a
            terminal state (COMPLETED, TERMINATED, FAILED);
            RECORD_VERSION_CONFLICT — record_version is stale;
            IDEMPOTENCY_KEY_REPLAY — same key reused with a different request body.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                InstanceAlreadyTerminal:
                  value:
                    type: "https://errors.bcbp.io/execution/instance-already-terminal"
                    title: "Instance Already Terminal"
                    status: 409
                    detail: "instance is already COMPLETED"
                    instance: "/api/v1/instances/3fa85f64-5717-4562-b3fc-2c963f66afa6/cancel"
                    code: "INSTANCE_ALREADY_TERMINAL"
                RecordVersionConflict:
                  value:
                    type: "https://errors.bcbp.io/execution/record-version-conflict"
                    title: "Record Version Conflict"
                    status: 409
                    detail: "the instance has been modified since record_version=2 was read"
                    instance: "/api/v1/instances/3fa85f64-5717-4562-b3fc-2c963f66afa6/cancel"
                    code: "RECORD_VERSION_CONFLICT"
                IdempotencyReplay:
                  value:
                    type: "https://errors.bcbp.io/execution/idempotency-key-replay"
                    title: "Idempotency Key Replay"
                    status: 409
                    detail: "Idempotency-Key reused with a different request body"
                    instance: "/api/v1/instances/3fa85f64-5717-4562-b3fc-2c963f66afa6/cancel"
                    code: "IDEMPOTENCY_KEY_REPLAY"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/instances/{id}/terminate:
    post:
      operationId: terminateInstance
      tags: [Instances]
      summary: Hard-terminate a workflow instance (admin)
      description: >
        Calls TemporalClient.TerminateWorkflow immediately — does not wait for the current
        activity to complete. Use this when cancel is insufficient (e.g. the workflow is stuck).
        Emits WorkflowFinished(TERMINATED).
      security:
        - GatewayTenantContext: []
          UserContext: []
          AdminRole: []
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/TenantRolesHeader"
        - $ref: "#/components/parameters/InstanceIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: Human-readable reason for termination; stored on the instance record.
                  example: "Duplicate instance created in error"
      responses:
        "200":
          description: >-
            Terminate already completed synchronously (direct DB write then
            TerminateWorkflow) by the time this response is sent — unlike the
            other lifecycle endpoints, which forward a signal for the running
            workflow to process asynchronously.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/InstanceNotFound"
        "409":
          description: >
            State conflict. See code field: INSTANCE_ALREADY_TERMINAL — instance is already in a
            terminal state; IDEMPOTENCY_KEY_REPLAY — same key reused with a different request body.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                InstanceAlreadyTerminal:
                  value:
                    type: "https://errors.bcbp.io/execution/instance-already-terminal"
                    title: "Instance Already Terminal"
                    status: 409
                    detail: "instance is already TERMINATED"
                    instance: "/api/v1/instances/3fa85f64-5717-4562-b3fc-2c963f66afa6/terminate"
                    code: "INSTANCE_ALREADY_TERMINAL"
                IdempotencyReplay:
                  value:
                    type: "https://errors.bcbp.io/execution/idempotency-key-replay"
                    title: "Idempotency Key Replay"
                    status: 409
                    detail: "Idempotency-Key reused with a different request body"
                    instance: "/api/v1/instances/3fa85f64-5717-4562-b3fc-2c963f66afa6/terminate"
                    code: "IDEMPOTENCY_KEY_REPLAY"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/instances/{id}/nodes/{node}/complete:
    post:
      operationId: completeOutsideWait
      tags: [Instances]
      summary: An outside party's answer completes a receive task
      description: >
        Callable by an admin or by a user with an active assignment on a task of the instance.
        Completes the receive task whose node key is node, which no send task of the plan
        feeds: only an outside party's answer can. The published version lists such steps as
        its waits. The variables merge into the instance's variables. The node key's "/" must
        be percent-encoded as %2F.
      security:
        - GatewayTenantContext: []
          UserContext: []
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/TenantRolesHeader"
        - $ref: "#/components/parameters/InstanceIdPath"
        - name: node
          in: path
          required: true
          schema:
            type: string
          description: >
            The wait's host: the receive task's node key, or for a boundary the host stage's
            node key or the id of the subprocess or call it is attached to. The "/" in a node
            key must be percent-encoded as %2F.
          example: "Ops%2FReceive_Bid"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutsideAnswer"
      responses:
        "202":
          description: Answer accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: >
            INSTANCE_NOT_FOUND, or WAIT_NOT_FOUND: the key is not an outside wait of the
            instance's plan.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: >
            INVALID_INSTANCE_STATE: the instance is not RUNNING or DEGRADED;
            NOT_WAITING: the instance is not waiting in that step now;
            IDEMPOTENCY_KEY_REPLAY: same key reused with a different request body.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/instances/{id}/nodes/{node}/boundaries/{boundary}/fire:
    post:
      operationId: fireOutsideBoundary
      tags: [Instances]
      summary: An outside party's message fires a message boundary
      description: >
        Callable by an admin or by a user with an active assignment on a task of the instance.
        Fires the message boundary boundary of the host node, a boundary no send task of the
        plan feeds. node is the host stage's node key, or the id of the subprocess or call the
        boundary is attached to. The variables merge into the instance's variables. The node
        key's "/" must be percent-encoded as %2F.
      security:
        - GatewayTenantContext: []
          UserContext: []
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/TenantRolesHeader"
        - $ref: "#/components/parameters/InstanceIdPath"
        - name: node
          in: path
          required: true
          schema:
            type: string
          description: >
            The wait's host: the receive task's node key, or for a boundary the host stage's
            node key or the id of the subprocess or call it is attached to. The "/" in a node
            key must be percent-encoded as %2F.
          example: "Ops%2FReceive_Bid"
        - name: boundary
          in: path
          required: true
          schema:
            type: string
          description: The BPMN id of the message boundary event.
          example: "Boundary_Withdraw"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutsideAnswer"
      responses:
        "202":
          description: Message accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: >
            INSTANCE_NOT_FOUND, or WAIT_NOT_FOUND: the host and boundary are not an outside
            wait of the instance's plan.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: >
            INVALID_INSTANCE_STATE: the instance is not RUNNING or DEGRADED;
            NOT_WAITING: the instance is not waiting in that boundary now;
            IDEMPOTENCY_KEY_REPLAY: same key reused with a different request body.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/instances/{id}/force-forward:
    post:
      operationId: forceForward
      tags: [Instances]
      summary: Skip the current step and jump to a target node (admin)
      description: >
        Sends a force-forward signal to the Temporal workflow. Active tasks at the current
        node(s) are marked SUPERSEDED and the workflow function jumps to target_node_key.
        Inside a parallel step or a DEGRADED instance, the department of target_node_key
        names the branch the jump applies to.
        Use only when a step is legitimately blocked and cannot be resolved through normal
        task operations.
      security:
        - GatewayTenantContext: []
          UserContext: []
          AdminRole: []
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/TenantRolesHeader"
        - $ref: "#/components/parameters/InstanceIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_node_key, record_version]
              properties:
                target_node_key:
                  type: string
                  description: BPMN node key to advance to. Must exist in the compiled plan.
                  example: "approval_stage"
                record_version:
                  type: integer
                  description: >
                    The caller's current view of the instance's record_version, checked
                    synchronously before the signal is forwarded (§5.10).
                  example: 5
      responses:
        "202":
          description: Force-forward signal accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/InstanceNotFound"
        "409":
          description: >
            State conflict. See code field: INVALID_INSTANCE_STATE — instance is not RUNNING;
            TARGET_NODE_NOT_FOUND — target node is not reachable from current state;
            RECORD_VERSION_CONFLICT — record_version is stale;
            IDEMPOTENCY_KEY_REPLAY — same key reused with a different request body.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                InstanceStateInvalid:
                  value:
                    type: "https://errors.bcbp.io/execution/invalid-instance-state"
                    title: "Invalid Instance State"
                    status: 409
                    detail: "instance is not RUNNING"
                    instance: "/api/v1/instances/3fa85f64-5717-4562-b3fc-2c963f66afa6/force-forward"
                    code: "INVALID_INSTANCE_STATE"
                TargetNodeNotFound:
                  value:
                    type: "https://errors.bcbp.io/execution/target-node-not-found"
                    title: "Target Node Not Found"
                    status: 409
                    detail: "target_node_key 'approval_stage' is not reachable from the current state"
                    instance: "/api/v1/instances/3fa85f64-5717-4562-b3fc-2c963f66afa6/force-forward"
                    code: "TARGET_NODE_NOT_FOUND"
                RecordVersionConflict:
                  value:
                    type: "https://errors.bcbp.io/execution/record-version-conflict"
                    title: "Record Version Conflict"
                    status: 409
                    detail: "the instance has been modified since record_version=5 was read"
                    instance: "/api/v1/instances/3fa85f64-5717-4562-b3fc-2c963f66afa6/force-forward"
                    code: "RECORD_VERSION_CONFLICT"
                IdempotencyReplay:
                  value:
                    type: "https://errors.bcbp.io/execution/idempotency-key-replay"
                    title: "Idempotency Key Replay"
                    status: 409
                    detail: "Idempotency-Key reused with a different request body"
                    instance: "/api/v1/instances/3fa85f64-5717-4562-b3fc-2c963f66afa6/force-forward"
                    code: "IDEMPOTENCY_KEY_REPLAY"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/instances/{id}/force-back:
    post:
      operationId: forceBack
      tags: [Instances]
      summary: Regress the workflow to the previous completed step (admin)
      description: >
        Sends a force-back signal to the Temporal workflow. The workflow function pops
        the completedNodes stack, cancels any currently active tasks, and re-creates the
        task for the previous step. Returns 409 if there is no previous step to revert to
        (the instance is at its first step). In a DEGRADED instance with more than one
        failed branch, target_node_key names a node of the branch to resume.
      security:
        - GatewayTenantContext: []
          UserContext: []
          AdminRole: []
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/TenantRolesHeader"
        - $ref: "#/components/parameters/InstanceIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [record_version]
              properties:
                record_version:
                  type: integer
                  description: >
                    The caller's current view of the instance's record_version, checked
                    synchronously before the signal is forwarded (§5.10).
                  example: 6
                target_node_key:
                  type: string
                  maxLength: 255
                  description: >
                    Optional. In a DEGRADED instance, a node of the failed branch to
                    resume; may be omitted when one branch has failed.
      responses:
        "202":
          description: Force-back signal accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/InstanceNotFound"
        "409":
          description: >
            State conflict. See code field: FORCE_BACK_NO_SAVED_BRANCH — instance is not RUNNING,
            or the completedNodes stack is empty (the instance has not yet advanced past the
            first step); RECORD_VERSION_CONFLICT — record_version is stale;
            IDEMPOTENCY_KEY_REPLAY — same key reused with a different request body.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                ForceBackNoSavedBranch:
                  value:
                    type: "https://errors.bcbp.io/execution/force-back-no-saved-branch"
                    title: "Force Back No Saved Branch"
                    status: 409
                    detail: "no completed steps to revert to"
                    instance: "/api/v1/instances/3fa85f64-5717-4562-b3fc-2c963f66afa6/force-back"
                    code: "FORCE_BACK_NO_SAVED_BRANCH"
                RecordVersionConflict:
                  value:
                    type: "https://errors.bcbp.io/execution/record-version-conflict"
                    title: "Record Version Conflict"
                    status: 409
                    detail: "the instance has been modified since record_version=6 was read"
                    instance: "/api/v1/instances/3fa85f64-5717-4562-b3fc-2c963f66afa6/force-back"
                    code: "RECORD_VERSION_CONFLICT"
                IdempotencyReplay:
                  value:
                    type: "https://errors.bcbp.io/execution/idempotency-key-replay"
                    title: "Idempotency Key Replay"
                    status: 409
                    detail: "Idempotency-Key reused with a different request body"
                    instance: "/api/v1/instances/3fa85f64-5717-4562-b3fc-2c963f66afa6/force-back"
                    code: "IDEMPOTENCY_KEY_REPLAY"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/instances/{id}/nodes/{node}/override:
    post:
      operationId: overrideNodeAssignee
      tags: [Instances]
      summary: Override the assignee for a specific node on a running instance (admin)
      description: >
        Admin override: replaces the default/current assignee for the given BPMN node with
        new_user_id, independent of the compiled plan's default assignment. Applies only to
        the node's current or future assignment; does not affect already-completed assignments.
        Returns 400 OVERRIDE_NO_OP if new_user_id is already the effective assignee for this node.
      security:
        - GatewayTenantContext: []
          UserContext: []
          AdminRole: []
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/TenantRolesHeader"
        - $ref: "#/components/parameters/InstanceIdPath"
        - $ref: "#/components/parameters/NodeKeyPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_user_id, record_version]
              properties:
                new_user_id:
                  type: string
                  format: uuid
                  description: UUID of the user to assign this node to.
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
                  nullable: true
                  description: >
                    Optional human-readable reason for the override; stored on the
                    assignee_overrides audit record (§4.13).
                  example: "Original default assignee left the department"
                record_version:
                  type: integer
                  description: >
                    The caller's current view of the task's record_version at this node,
                    checked before the eligibility call and again before persisting (§5.4).
                  example: 4
      responses:
        "200":
          description: Override persisted and signaled; returns the override record (rev 1.23 — not a 202/SignalAccepted body).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverrideResult"
        "400":
          description: >
            Malformed request body, or code field OVERRIDE_NO_OP — new_user_id is already
            the effective assignee for this node.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                BadRequest:
                  value:
                    type: "https://errors.bcbp.io/execution/bad-request"
                    title: "Bad Request"
                    status: 400
                    detail: "field 'new_user_id' is required"
                    instance: "/api/v1/instances/3fa85f64-5717-4562-b3fc-2c963f66afa6/nodes/review_stage_1/override"
                    code: "BAD_REQUEST"
                OverrideNoOp:
                  value:
                    type: "https://errors.bcbp.io/execution/override-no-op"
                    title: "Override No-Op"
                    status: 400
                    detail: "new_user_id is already the effective assignee for node 'review_stage_1'"
                    instance: "/api/v1/instances/3fa85f64-5717-4562-b3fc-2c963f66afa6/nodes/review_stage_1/override"
                    code: "OVERRIDE_NO_OP"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/InstanceNotFound"
        "409":
          description: >
            State conflict. See code field: NODE_ALREADY_RESOLVED — the node has already
            completed or advanced past; RECORD_VERSION_CONFLICT — a concurrent change raced
            this request; IDEMPOTENCY_KEY_REPLAY — same key reused with a different request body.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                NodeAlreadyResolved:
                  value:
                    type: "https://errors.bcbp.io/execution/node-already-resolved"
                    title: "Node Already Resolved"
                    status: 409
                    detail: "node 'review_stage_1' has already been completed or advanced past"
                    instance: "/api/v1/instances/3fa85f64-5717-4562-b3fc-2c963f66afa6/nodes/review_stage_1/override"
                    code: "NODE_ALREADY_RESOLVED"
                RecordVersionConflict:
                  value:
                    type: "https://errors.bcbp.io/execution/record-version-conflict"
                    title: "Record Version Conflict"
                    status: 409
                    detail: "a concurrent change was applied to this node; refresh and retry"
                    instance: "/api/v1/instances/3fa85f64-5717-4562-b3fc-2c963f66afa6/nodes/review_stage_1/override"
                    code: "RECORD_VERSION_CONFLICT"
                IdempotencyReplay:
                  value:
                    type: "https://errors.bcbp.io/execution/idempotency-key-replay"
                    title: "Idempotency Key Replay"
                    status: 409
                    detail: "Idempotency-Key reused with a different request body"
                    instance: "/api/v1/instances/3fa85f64-5717-4562-b3fc-2c963f66afa6/nodes/review_stage_1/override"
                    code: "IDEMPOTENCY_KEY_REPLAY"
        "422":
          description: The specified new_user_id is not an eligible assignee for this node.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: "https://errors.bcbp.io/execution/assignee-ineligible"
                title: "Assignee Ineligible"
                status: 422
                detail: "new_user_id is not eligible to be assigned to node 'review_stage_1'"
                instance: "/api/v1/instances/3fa85f64-5717-4562-b3fc-2c963f66afa6/nodes/review_stage_1/override"
                code: "ASSIGNEE_INELIGIBLE"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/instances/{id}/events:
    get:
      operationId: listInstanceEvents
      tags: [Instances]
      summary: Get activity event log for a workflow instance
      description: >
        Returns the activity event log for a workflow instance ordered by occurred_at DESC,
        indexed by (workflow_instance_id, occurred_at DESC, id DESC) (§4.9). Keyset pagination
        (§5.9), same contract as every other list endpoint — cursor/limit in, items[] +
        next_cursor out. Same intra-tenant visibility rule as GET /instances/:id (§9.2): visible
        only if the caller is (or was) an assignee on any task under this instance, the caller's
        x-departments includes any currently-open task's department_id, or the caller holds
        tenant_admin/tenant_owner.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/TenantRolesHeader"
        - $ref: "#/components/parameters/DepartmentsHeader"
        - $ref: "#/components/parameters/TraceParentHeader"
        - $ref: "#/components/parameters/InstanceIdPath"
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Keyset page of the instance's activity event log (§5.9).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkflowEvent"
                  next_cursor:
                    type: string
                    nullable: true
                    description: Opaque cursor for the next (older) page; omitted/null on the final page.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            NOT_AUTHORIZED_FOR_RESOURCE — caller is not an assignee, not in the current
            department, and not an admin.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: "https://errors.bcbp.io/execution/not-authorized-for-resource"
                title: "Not Authorized For Resource"
                status: 403
                detail: "caller is not an assignee, department member, or admin for this instance"
                instance: "/api/v1/instances/3fa85f64-5717-4562-b3fc-2c963f66afa6/events"
                code: "NOT_AUTHORIZED_FOR_RESOURCE"
        "404":
          $ref: "#/components/responses/InstanceNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/tasks:
    get:
      operationId: listTasks
      tags: [Tasks]
      summary: List workflow tasks
      description: >
        Returns a paginated list of tasks for the caller's tenant. Supports filtering by
        status, assignee, department, instance, and due date. Used by task dashboards.
        Additionally scoped to the same assignee/department/admin visibility rule as
        GET /tasks/:id (§9.2) — non-visible tasks are simply absent from the page, not an error.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/LimitQuery"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TaskStatus"
          description: Filter by task status.
        - name: assignee_user_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter to tasks with an active assignment for this user.
        - name: department_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter to tasks belonging to this department.
        - name: instance_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter to tasks belonging to this workflow instance.
        - name: due_before
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Include only tasks with due_at before this timestamp.
      responses:
        "200":
          description: Keyset page of workflow tasks (§5.9).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TaskSummary"
                  next_cursor:
                    type: string
                    nullable: true
                    description: Opaque cursor for the next page; omitted/null on the final page.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/tasks/{id}:
    get:
      operationId: getTask
      tags: [Tasks]
      summary: Get task detail
      description: >
        Returns task detail including payload_json and all assignment records (active and
        historical). Visible only if the caller is (or was) an assignee, the caller's
        x-departments includes the task's department_id, or the caller holds
        tenant_admin/tenant_owner (§9.2). Returns 403 NOT_AUTHORIZED_FOR_RESOURCE otherwise —
        not 404, since the task is already confirmed to exist in the caller's own tenant.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/TenantRolesHeader"
        - $ref: "#/components/parameters/DepartmentsHeader"
        - $ref: "#/components/parameters/TaskIdPath"
      responses:
        "200":
          description: Task detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            NOT_AUTHORIZED_FOR_RESOURCE — caller is not an assignee, not in the task's
            department, and not an admin.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: "https://errors.bcbp.io/execution/not-authorized-for-resource"
                title: "Not Authorized For Resource"
                status: 403
                detail: "caller is not the assignee, department member, or admin for this task"
                instance: "/api/v1/tasks/3fa85f64-5717-4562-b3fc-2c963f66afa6"
                code: "NOT_AUTHORIZED_FOR_RESOURCE"
        "404":
          $ref: "#/components/responses/TaskNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/tasks/{id}/claim:
    post:
      operationId: claimTask
      tags: [Tasks]
      summary: Claim a task assignment
      description: >
        The calling user claims their active unclaimed assignment for this task.
        Sets claimed_at on the assignment row and increments task.record_version.
        Sends a task-claim signal to the Temporal workflow.
        Returns 403 if the user has no active assignment.
        Returns 409 TASK_ALREADY_CLAIMED if the user's assignment is already claimed.
        Returns 409 RECORD_VERSION_CONFLICT if the supplied record_version is stale.
        Returns 409 CLAIM_NOT_APPLICABLE if the task's assignee_mode is single — claim exists
        only to establish a lead among multiple assignees (assignee_mode=all).
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/TaskIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [record_version]
              properties:
                record_version:
                  type: integer
                  minimum: 0
                  description: >
                    The task record_version the client last observed. Must match the current
                    task.record_version; mismatch returns RECORD_VERSION_CONFLICT.
                  example: 0
      responses:
        "202":
          description: Claim accepted; returns the task with its incremented record_version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller has no active assignment for this task.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: "https://errors.bcbp.io/execution/assignee-not-assigned"
                title: "Not Assigned"
                status: 403
                detail: "caller does not have an active assignment for this task"
                instance: "/api/v1/tasks/3fa85f64-5717-4562-b3fc-2c963f66afa6/claim"
                code: "NOT_ASSIGNEE"
        "404":
          $ref: "#/components/responses/TaskNotFound"
        "409":
          description: >
            State conflict. See code field:
            TASK_ALREADY_CLAIMED — the caller's assignment is already claimed;
            RECORD_VERSION_CONFLICT — the supplied version is stale (another claim beat you);
            INVALID_TASK_STATE — the task is not in READY or IN_PROGRESS status;
            CLAIM_NOT_APPLICABLE — the task's assignee_mode is single, so claim does not apply.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                AlreadyClaimed:
                  value:
                    type: "https://errors.bcbp.io/execution/task-already-claimed"
                    title: "Task Already Claimed"
                    status: 409
                    detail: "this assignment has already been claimed"
                    instance: "/api/v1/tasks/3fa85f64-5717-4562-b3fc-2c963f66afa6/claim"
                    code: "TASK_ALREADY_CLAIMED"
                ClaimNotApplicable:
                  value:
                    type: "https://errors.bcbp.io/execution/claim-not-applicable"
                    title: "Claim Not Applicable"
                    status: 409
                    detail: "claim only applies to tasks with assignee_mode=all"
                    instance: "/api/v1/tasks/3fa85f64-5717-4562-b3fc-2c963f66afa6/claim"
                    code: "CLAIM_NOT_APPLICABLE"
                ConcurrencyViolation:
                  value:
                    type: "https://errors.bcbp.io/execution/task-concurrency-violation"
                    title: "Task Concurrency Violation"
                    status: 409
                    detail: "task record_version mismatch; refresh and retry"
                    instance: "/api/v1/tasks/3fa85f64-5717-4562-b3fc-2c963f66afa6/claim"
                    code: "RECORD_VERSION_CONFLICT"
                IdempotencyReplay:
                  value:
                    type: "https://errors.bcbp.io/execution/idempotency-key-replay"
                    title: "Idempotency Key Replay"
                    status: 409
                    detail: "Idempotency-Key reused with a different request body"
                    instance: "/api/v1/tasks/3fa85f64-5717-4562-b3fc-2c963f66afa6/claim"
                    code: "IDEMPOTENCY_KEY_REPLAY"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/tasks/{id}/complete:
    post:
      operationId: completeTask
      tags: [Tasks]
      summary: Complete a task assignment
      description: >
        The calling user submits their completion payload for their active assignment.
        Sets completed_at and result_json on the assignment. If all active assignments for
        the task are now complete, the task status transitions to COMPLETED and a
        task-complete signal is sent to Temporal (which then advances the workflow).
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/TaskIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [record_version]
              properties:
                record_version:
                  type: integer
                  minimum: 0
                  description: The task record_version the client last observed.
                  example: 1
                result_json:
                  type: object
                  additionalProperties: true
                  description: >
                    Completion payload from this assignee. Optional — not bound as
                    required by the handler. Schema is workflow-defined; the service
                    stores it opaquely. Included in the TaskCompleted event.
                  example:
                    approved: true
                    notes: "All documents are in order."
      responses:
        "202":
          description: >
            Completion recorded; returns the task as of this write. The response does not
            carry a separate all_done flag — check the returned status field instead (rev 1.23).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller has no active claimed assignment for this task.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: "https://errors.bcbp.io/execution/assignee-not-assigned"
                title: "Not Assigned"
                status: 403
                detail: "caller does not have an active claimed assignment for this task"
                instance: "/api/v1/tasks/3fa85f64-5717-4562-b3fc-2c963f66afa6/complete"
                code: "NOT_ASSIGNEE"
        "404":
          $ref: "#/components/responses/TaskNotFound"
        "409":
          description: >
            State conflict. See code field:
            RECORD_VERSION_CONFLICT — version mismatch;
            INVALID_TASK_STATE — task is not IN_PROGRESS;
            IDEMPOTENCY_KEY_REPLAY — same key reused with a different request body.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                IdempotencyReplay:
                  value:
                    type: "https://errors.bcbp.io/execution/idempotency-key-replay"
                    title: "Idempotency Key Replay"
                    status: 409
                    detail: "Idempotency-Key reused with a different request body"
                    instance: "/api/v1/tasks/3fa85f64-5717-4562-b3fc-2c963f66afa6/complete"
                    code: "IDEMPOTENCY_KEY_REPLAY"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/tasks/{id}/defer:
    post:
      operationId: deferTask
      tags: [Tasks]
      summary: Defer a task (send it back)
      description: >
        The calling user defers their claimed assignment — indicating the task cannot
        proceed as-is (e.g. missing documents, incomplete prior step). The task status
        transitions to DEFERRED and the instance goes back one step, as an admin
        force-back does: the previous step's department runs again and creates a new
        task for it. The response returns the deferred task itself. A task with no
        completed step before it answers 409 INVALID_TASK_STATE.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/TaskIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [record_version]
              properties:
                record_version:
                  type: integer
                  minimum: 0
                  description: The task record_version the client last observed.
                  example: 1
                reason:
                  type: string
                  maxLength: 500
                  description: >
                    Human-readable reason for deferral. Optional — not bound as required
                    by the handler. Stored on the TaskDeferred event.
                  example: "Supporting documents are missing from the tender package."
      responses:
        "202":
          description: Defer accepted; returns the deferred task (now in DEFERRED status).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller has no active claimed assignment for this task.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: "https://errors.bcbp.io/execution/assignee-not-assigned"
                title: "Not Assigned"
                status: 403
                detail: "caller does not have an active claimed assignment for this task"
                instance: "/api/v1/tasks/3fa85f64-5717-4562-b3fc-2c963f66afa6/defer"
                code: "NOT_ASSIGNEE"
        "404":
          $ref: "#/components/responses/TaskNotFound"
        "409":
          description: >
            RECORD_VERSION_CONFLICT — version mismatch;
            INVALID_TASK_STATE — task is not IN_PROGRESS or has no previous step to defer to;
            IDEMPOTENCY_KEY_REPLAY — same key reused with a different request body.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                IdempotencyReplay:
                  value:
                    type: "https://errors.bcbp.io/execution/idempotency-key-replay"
                    title: "Idempotency Key Replay"
                    status: 409
                    detail: "Idempotency-Key reused with a different request body"
                    instance: "/api/v1/tasks/3fa85f64-5717-4562-b3fc-2c963f66afa6/defer"
                    code: "IDEMPOTENCY_KEY_REPLAY"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/tasks/{id}/reassign:
    post:
      operationId: reassignTask
      tags: [Tasks]
      summary: Reassign a task to a different user (admin)
      description: >
        Admin override: vacates the current active assignment(s) and creates a new assignment
        for the specified user. Sends an instance-reassign signal to Temporal.
        No eligibility check is performed — admin reassignment is an explicit override, unlike
        node-override (§5.4), which does check eligibility.
        Returns 400 OVERRIDE_NO_OP if new_assignee_user_id is already the current assignee.
      security:
        - GatewayTenantContext: []
          UserContext: []
          AdminRole: []
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/TenantRolesHeader"
        - $ref: "#/components/parameters/TaskIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_assignee_user_id, record_version]
              properties:
                new_assignee_user_id:
                  type: string
                  format: uuid
                  description: UUID of the user to assign this task to.
                reason:
                  type: string
                  maxLength: 500
                  nullable: true
                  description: Optional human-readable reason for the reassignment.
                  example: "Original assignee is on leave"
                record_version:
                  type: integer
                  description: >
                    The caller's current view of the task's record_version, checked
                    synchronously before the signal is forwarded (§5.10).
                  example: 2
      responses:
        "202":
          description: Reassignment accepted; returns the task with its new assignment reflected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSummary"
        "400":
          description: >
            Malformed request body, or code field OVERRIDE_NO_OP — new_assignee_user_id is
            already the current assignee.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                BadRequest:
                  value:
                    type: "https://errors.bcbp.io/execution/bad-request"
                    title: "Bad Request"
                    status: 400
                    detail: "field 'new_assignee_user_id' is required"
                    instance: "/api/v1/tasks/3fa85f64-5717-4562-b3fc-2c963f66afa6/reassign"
                    code: "BAD_REQUEST"
                OverrideNoOp:
                  value:
                    type: "https://errors.bcbp.io/execution/override-no-op"
                    title: "Override No-Op"
                    status: 400
                    detail: "new_assignee_user_id is already the current assignee"
                    instance: "/api/v1/tasks/3fa85f64-5717-4562-b3fc-2c963f66afa6/reassign"
                    code: "OVERRIDE_NO_OP"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/TaskNotFound"
        "409":
          description: >
            State conflict. See code field:
            INVALID_TASK_STATE — task is already COMPLETED, DEFERRED, or FAILED;
            RECORD_VERSION_CONFLICT — record_version is stale;
            IDEMPOTENCY_KEY_REPLAY — same key reused with a different request body.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                RecordVersionConflict:
                  value:
                    type: "https://errors.bcbp.io/execution/record-version-conflict"
                    title: "Record Version Conflict"
                    status: 409
                    detail: "the task has been modified since record_version=2 was read"
                    instance: "/api/v1/tasks/3fa85f64-5717-4562-b3fc-2c963f66afa6/reassign"
                    code: "RECORD_VERSION_CONFLICT"
                IdempotencyReplay:
                  value:
                    type: "https://errors.bcbp.io/execution/idempotency-key-replay"
                    title: "Idempotency Key Replay"
                    status: 409
                    detail: "Idempotency-Key reused with a different request body"
                    instance: "/api/v1/tasks/3fa85f64-5717-4562-b3fc-2c963f66afa6/reassign"
                    code: "IDEMPOTENCY_KEY_REPLAY"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/workflows/active-by-user:
    get:
      operationId: getActiveTasksByUser
      tags: [Tasks]
      summary: Get active task assignments for a user (admin / IAM reconciliation)
      description: >
        Returns all READY and IN_PROGRESS task assignments for the specified user across
        all workflow instances. Used by IAM SQS handlers (delegation, user deletion) to
        determine which tasks need to be reassigned, and by admin UIs for user activity audits.
      security:
        - GatewayTenantContext: []
          UserContext: []
          AdminRole: []
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/TenantRolesHeader"
        - name: user_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the user whose active assignments to retrieve.
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Keyset page of active task assignments for the specified user (§5.9).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ActiveUserTask"
                  next_cursor:
                    type: string
                    nullable: true
                    description: Opaque cursor for the next page; omitted/null on the final page.
        "400":
          description: Missing or invalid user_id query parameter.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: "https://errors.bcbp.io/execution/bad-request"
                title: "Bad Request"
                status: 400
                detail: "user_id query parameter is required"
                instance: "/api/v1/workflows/active-by-user"
                code: "BAD_REQUEST"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
