  /api/v1/instances/{id}/force-forward:
    post:
      operationId: forceForward
      tags: [Instances]
      summary: Skip the current step and jump to a target node (admin)
      description: >
        Sends a force-forward signal to the Temporal workflow. Active tasks at the current
        node(s) are marked SUPERSEDED and the workflow function jumps to target_node_key.
        Inside a parallel step or a DEGRADED instance, the department of target_node_key
        names the branch the jump applies to.
        Use only when a step is legitimately blocked and cannot be resolved through normal
        task operations.
      security:
        - GatewayTenantContext: []
          UserContext: []
          AdminRole: []
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/TenantRolesHeader"
        - $ref: "#/components/parameters/InstanceIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [target_node_key, record_version]
              properties:
                target_node_key:
                  type: string
                  description: >
                    BPMN node key to advance to. Must be a node the instance can run: a node of
                    its main plan (called plans included), and, inside a parallel step of a
                    RUNNING instance, one on a branch of that step.
                  example: "approval_stage"
                record_version:
                  type: integer
                  minimum: 1
                  description: >
                    The caller's current view of the instance's record_version, checked
                    synchronously before the signal is forwarded (§5.10); required, and at
                    least 1, the lowest version an instance can hold. A body that omits it or
                    carries 0 is refused 400 BAD_REQUEST.
                  example: 5
      responses:
        "202":
          description: Force-forward signal accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/InstanceNotFound"
        "409":
          description: >
            State conflict. See code field: INSTANCE_ALREADY_TERMINAL — instance is already in a
            terminal state (COMPLETED, TERMINATED, FAILED);
            INVALID_INSTANCE_STATE — instance is neither RUNNING nor DEGRADED;
            TARGET_NODE_NOT_FOUND — the workflow could not run target_node_key, checked against the
            compiled plan and the instance's current state before the signal is sent: the node is
            not in the plan the instance runs (a called plan counts once expanded), or, inside a
            parallel step of a RUNNING instance, its department is not a branch of that step;
            VERSION_INVALID — the stored plan has a schema version this service does not read, is not valid JSON, or names no main plan;
            RECORD_VERSION_CONFLICT — record_version is stale;
            IDEMPOTENCY_KEY_REPLAY — same key reused with a different request body.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                InstanceStateInvalid:
                  value:
                    type: "https://errors.bcbp.io/execution/invalid-instance-state"
                    title: "Invalid Instance State"
                    status: 409
                    detail: "action not valid for instance's current status"
                    instance: "/api/v1/instances/3fa85f64-5717-4562-b3fc-2c963f66afa6/force-forward"
                    code: "INVALID_INSTANCE_STATE"
                TargetNodeNotFound:
                  value:
                    type: "https://errors.bcbp.io/execution/target-node-not-found"
                    title: "Target Node Not Found"
                    status: 409
                    detail: "target node not found in the compiled plan"
                    instance: "/api/v1/instances/3fa85f64-5717-4562-b3fc-2c963f66afa6/force-forward"
                    code: "TARGET_NODE_NOT_FOUND"
                RecordVersionConflict:
                  value:
                    type: "https://errors.bcbp.io/execution/record-version-conflict"
                    title: "Record Version Conflict"
                    status: 409
                    detail: "record version conflict"
                    instance: "/api/v1/instances/3fa85f64-5717-4562-b3fc-2c963f66afa6/force-forward"
                    code: "RECORD_VERSION_CONFLICT"
                IdempotencyReplay:
                  value:
                    type: "https://errors.bcbp.io/execution/idempotency-key-replay"
                    title: "Idempotency Key Replay"
                    status: 409
                    detail: "Idempotency-Key reused with a different request body"
                    instance: "/api/v1/instances/3fa85f64-5717-4562-b3fc-2c963f66afa6/force-forward"
                    code: "IDEMPOTENCY_KEY_REPLAY"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/instances/{id}/force-back:
    post:
      operationId: forceBack
      tags: [Instances]
      summary: Regress the workflow to the previous completed step (admin)
      description: >
        Sends a force-back signal to the Temporal workflow. The workflow function pops
        the completedNodes stack, cancels any currently active tasks, and re-creates the
        task for the previous step. Returns 409 if there is no previous step to revert to
        (the instance is at its first step). In a DEGRADED instance with more than one
        failed branch, target_node_key names a node of the branch to resume.
      security:
        - GatewayTenantContext: []
          UserContext: []
          AdminRole: []
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/TenantRolesHeader"
        - $ref: "#/components/parameters/InstanceIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [record_version]
              properties:
                record_version:
                  type: integer
                  minimum: 1
                  description: >
                    The caller's current view of the instance's record_version, checked
                    synchronously before the signal is forwarded (§5.10); required, and at
                    least 1, the lowest version an instance can hold. A body that omits it or
                    carries 0 is refused 400 BAD_REQUEST.
                  example: 6
                target_node_key:
                  type: string
                  maxLength: 255
                  description: >
                    Optional. In a DEGRADED instance, a node of the failed branch to
                    resume; may be omitted when one branch has failed.
      responses:
        "202":
          description: Force-back signal accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/InstanceNotFound"
        "409":
          description: >
            State conflict. See code field: FORCE_BACK_NO_SAVED_BRANCH — a RUNNING instance with
            no completed step to go back to (it has not yet advanced past the first step);
            INVALID_INSTANCE_STATE — instance is neither RUNNING nor DEGRADED;
            INSTANCE_ALREADY_TERMINAL — instance is already in a terminal state;
            TARGET_NODE_NOT_FOUND — a DEGRADED instance's target_node_key names no node of the
            compiled plan the instance runs;
            VERSION_INVALID — the stored compiled plan, read to check target_node_key, cannot be
            decoded;
            RECORD_VERSION_CONFLICT — record_version is stale;
            IDEMPOTENCY_KEY_REPLAY — same key reused with a different request body.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                ForceBackNoSavedBranch:
                  value:
                    type: "https://errors.bcbp.io/execution/force-back-no-saved-branch"
                    title: "Force Back No Saved Branch"
                    status: 409
                    detail: "no completed step to go back to"
                    instance: "/api/v1/instances/3fa85f64-5717-4562-b3fc-2c963f66afa6/force-back"
                    code: "FORCE_BACK_NO_SAVED_BRANCH"
                RecordVersionConflict:
                  value:
                    type: "https://errors.bcbp.io/execution/record-version-conflict"
                    title: "Record Version Conflict"
                    status: 409
                    detail: "record version conflict"
                    instance: "/api/v1/instances/3fa85f64-5717-4562-b3fc-2c963f66afa6/force-back"
                    code: "RECORD_VERSION_CONFLICT"
                IdempotencyReplay:
                  value:
                    type: "https://errors.bcbp.io/execution/idempotency-key-replay"
                    title: "Idempotency Key Replay"
                    status: 409
                    detail: "Idempotency-Key reused with a different request body"
                    instance: "/api/v1/instances/3fa85f64-5717-4562-b3fc-2c963f66afa6/force-back"
                    code: "IDEMPOTENCY_KEY_REPLAY"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/instances/{id}/nodes/{node}/override:
    post:
      operationId: overrideNodeAssignee
      tags: [Instances]
      summary: Override the assignee for a specific node on a running instance (admin)
      description: >
        Admin override: replaces the default/current assignee for the given BPMN node with
        new_user_id, independent of the compiled plan's default assignment. Applies to a node
        that already has an open task; a node the instance has not reached has no task and is
        refused 404 TASK_NOT_FOUND (the assignee of a later node is set at start through the
        override map). Does not affect already-completed assignments. A task with no active
        assignee (for example after its only assignee was removed) is accepted and given to
        new_user_id. A connector-typed task is refused 409 TASK_NOT_HUMAN_ACTIONABLE before
        the eligibility read. The new user's eligibility is checked once, against the compiled
        plan, before anything is stored. The task's record_version is bumped in the same
        transaction as the override record, so of two admins overriding the same version only
        the first succeeds.
        Returns 400 OVERRIDE_NO_OP if new_user_id is already the effective assignee for this node.
        A 200 means the override is stored and the reassign signal was accepted, not that the
        assignment has already moved; read the task again to see who holds it.
      security:
        - GatewayTenantContext: []
          UserContext: []
          AdminRole: []
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/TenantRolesHeader"
        - $ref: "#/components/parameters/InstanceIdPath"
        - $ref: "#/components/parameters/NodeKeyPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [new_user_id, record_version]
              properties:
                new_user_id:
                  type: string
                  format: uuid
                  description: UUID of the user to assign this node to.
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
                  nullable: true
                  description: >
                    Optional human-readable reason for the override; stored on the
                    assignee_overrides audit record (§4.13). When sent it must contain
                    text: an empty or whitespace-only reason is refused 400 BAD_REQUEST;
                    an omitted or null one stores no reason.
                  example: "Original default assignee left the department"
                record_version:
                  type: integer
                  minimum: 1
                  description: >
                    The caller's current view of the task's record_version at this node,
                    checked before the eligibility call and again before persisting (§5.4);
                    required, and at least 1. A body that omits it or carries 0 is refused
                    400 BAD_REQUEST.
                  example: 4
      responses:
        "200":
          description: Override persisted and the reassign signal accepted (the assignment may not have moved yet); returns the override record, not a 202/SignalAccepted body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverrideResult"
        "400":
          description: >
            Malformed request body, or code field OVERRIDE_NO_OP — new_user_id is already
            the effective assignee for this node.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                BadRequest:
                  value:
                    type: "https://errors.bcbp.io/execution/bad-request"
                    title: "Bad Request"
                    status: 400
                    detail: "request body has missing or invalid fields"
                    instance: "/api/v1/instances/3fa85f64-5717-4562-b3fc-2c963f66afa6/nodes/review_stage_1/override"
                    code: "BAD_REQUEST"
                OverrideNoOp:
                  value:
                    type: "https://errors.bcbp.io/execution/override-no-op"
                    title: "Override No-Op"
                    status: 400
                    detail: "new assignee is already the current assignee"
                    instance: "/api/v1/instances/3fa85f64-5717-4562-b3fc-2c963f66afa6/nodes/review_stage_1/override"
                    code: "OVERRIDE_NO_OP"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: >
            INSTANCE_NOT_FOUND, with the same answer for an instance that does not exist and
            one that belongs to another tenant, or TASK_NOT_FOUND: the node has no task
            (the instance has not reached it, or it is not in the plan).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: >
            State conflict. See code field: TASK_NOT_HUMAN_ACTIONABLE — the task is
            connector-typed; NODE_ALREADY_RESOLVED — the node has already
            completed or advanced past; INVALID_INSTANCE_STATE — the instance is not RUNNING or
            DEGRADED; RECORD_VERSION_CONFLICT — record_version is stale, including the losing
            admin of two concurrent overrides; VERSION_INVALID — the eligibility check reads the
            compiled plan, and its schema version is not one this service reads;
            IDEMPOTENCY_KEY_REPLAY — same key reused with a different request body.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                NodeAlreadyResolved:
                  value:
                    type: "https://errors.bcbp.io/execution/node-already-resolved"
                    title: "Node Already Resolved"
                    status: 409
                    detail: "node has already progressed"
                    instance: "/api/v1/instances/3fa85f64-5717-4562-b3fc-2c963f66afa6/nodes/review_stage_1/override"
                    code: "NODE_ALREADY_RESOLVED"
                RecordVersionConflict:
                  value:
                    type: "https://errors.bcbp.io/execution/record-version-conflict"
                    title: "Record Version Conflict"
                    status: 409
                    detail: "record version conflict"
                    instance: "/api/v1/instances/3fa85f64-5717-4562-b3fc-2c963f66afa6/nodes/review_stage_1/override"
                    code: "RECORD_VERSION_CONFLICT"
                IdempotencyReplay:
                  value:
                    type: "https://errors.bcbp.io/execution/idempotency-key-replay"
                    title: "Idempotency Key Replay"
                    status: 409
                    detail: "Idempotency-Key reused with a different request body"
                    instance: "/api/v1/instances/3fa85f64-5717-4562-b3fc-2c963f66afa6/nodes/review_stage_1/override"
                    code: "IDEMPOTENCY_KEY_REPLAY"
        "422":
          description: >
            The specified new_user_id is not an eligible assignee for this node, or the node has
            no stage in the compiled plan.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: "https://errors.bcbp.io/execution/assignee-ineligible"
                title: "Assignee Ineligible"
                status: 422
                detail: "the user does not satisfy the task's department and role level"
                instance: "/api/v1/instances/3fa85f64-5717-4562-b3fc-2c963f66afa6/nodes/review_stage_1/override"
                code: "ASSIGNEE_INELIGIBLE"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/instances/{id}/events:
    get:
      operationId: listInstanceEvents
      tags: [Instances]
      summary: Get activity event log for a workflow instance
      description: >
        Returns the activity event log for a workflow instance ordered by occurred_at DESC,
        indexed by (workflow_instance_id, occurred_at DESC, id DESC) (§4.9). Keyset pagination
        (§5.9), same contract as every other list endpoint — cursor/limit in, items[] +
        next_cursor out. An event whose type this version does not name, or whose recorded
        envelope cannot be read, is left out and logged, so a page may hold fewer than limit
        items, or none, and still carry next_cursor; the end of the history is signalled only
        by the absence of next_cursor. Same intra-tenant visibility rule as GET /instances/:id (§9.2): visible
        only if the caller is (or was) an assignee on any task under this instance, the caller's
        x-departments includes any currently-open task's department_id, or the caller holds
        tenant_admin/tenant_owner.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/TenantRolesHeader"
        - $ref: "#/components/parameters/DepartmentsHeader"
        - $ref: "#/components/parameters/TraceParentHeader"
        - $ref: "#/components/parameters/InstanceIdPath"
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Keyset page of the instance's activity event log (§5.9).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkflowEvent"
                  next_cursor:
                    type: string
                    nullable: true
                    description: Opaque cursor for the next (older) page; omitted/null on the final page.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            NOT_AUTHORIZED_FOR_RESOURCE — caller is not an assignee, not in the current
            department, and not an admin.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: "https://errors.bcbp.io/execution/not-authorized-for-resource"
                title: "Not Authorized For Resource"
                status: 403
                detail: "caller is not authorized to read this resource"
                instance: "/api/v1/instances/3fa85f64-5717-4562-b3fc-2c963f66afa6/events"
                code: "NOT_AUTHORIZED_FOR_RESOURCE"
        "404":
          $ref: "#/components/responses/InstanceNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/tasks:
    get:
      operationId: listTasks
      tags: [Tasks]
      summary: List workflow tasks
      description: >
        Returns a paginated list of tasks for the caller's tenant. Supports filtering by
        status, assignee, department, instance, and due date. Used by task dashboards.
        Additionally scoped to the same assignee/department/admin visibility rule as
        GET /tasks/:id (§9.2) — non-visible tasks are simply absent from the page, not an error.
        A filter parameter sent with an empty value is treated as not sent.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/LimitQuery"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TaskStatus"
          description: Filter by task status.
        - name: assignee_user_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter to tasks with an active assignment for this user.
        - name: department_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter to tasks belonging to this department.
        - name: instance_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter to tasks belonging to this workflow instance.
        - name: due_before
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Include only tasks with due_at before this timestamp.
      responses:
        "200":
          description: Keyset page of workflow tasks (§5.9).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TaskSummary"
                  next_cursor:
                    type: string
                    nullable: true
                    description: Opaque cursor for the next page; omitted/null on the final page.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/tasks/{id}:
    get:
      operationId: getTask
      tags: [Tasks]
      summary: Get task detail
      description: >
        Returns task detail including payload_json and every assignment record the task has
        had, active and historical, each marked by is_active, in every task status (completed
        tasks included). Visible only if the caller holds an active assignment on the task,
        the caller's x-departments includes the task's department_id, or the caller holds
        tenant_admin/tenant_owner (§9.2). A caller who held the task earlier but holds no
        active assignment now reads it only through department membership or an admin role.
        Returns 403 NOT_AUTHORIZED_FOR_RESOURCE otherwise —
        not 404, since the task is already confirmed to exist in the caller's own tenant.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/TenantRolesHeader"
        - $ref: "#/components/parameters/DepartmentsHeader"
        - $ref: "#/components/parameters/TaskIdPath"
      responses:
        "200":
          description: Task detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            NOT_AUTHORIZED_FOR_RESOURCE — caller holds no active assignment on the task, is
            not in the task's department, and is not an admin.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: "https://errors.bcbp.io/execution/not-authorized-for-resource"
                title: "Not Authorized For Resource"
                status: 403
                detail: "caller is not authorized to read this resource"
                instance: "/api/v1/tasks/3fa85f64-5717-4562-b3fc-2c963f66afa6"
                code: "NOT_AUTHORIZED_FOR_RESOURCE"
        "404":
          $ref: "#/components/responses/TaskNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/tasks/{id}/claim:
    post:
      operationId: claimTask
      tags: [Tasks]
      summary: Claim a task assignment
      description: >
        The calling user claims the task, becoming its lead (assignee_mode=all only). One
        database transaction moves the lead marker to the caller, clears it on every other
        assignment, sets claimed_at on the caller's assignment (a repeated claim keeps the
        first claim time) and increments task.record_version, and queues the WorkflowTaskClaimed
        event in the same transaction; no signal is sent. A claim does not change the task's
        status. The checks run in this order and the first that fails
        refuses the claim: task exists, task is human-actionable, assignee_mode is all,
        record_version is current, status is READY or IN_PROGRESS, the instance is RUNNING or
        DEGRADED, the task has no other lead, the caller holds an active assignment, the
        caller is eligible.
        Returns 403 NOT_ASSIGNEE if the user has no active assignment.
        Returns 409 TASK_ALREADY_CLAIMED if another assignee already holds the lead and the
        supplied record_version is current; the lead repeating its own claim at the current
        record_version gets the task back.
        Returns 409 RECORD_VERSION_CONFLICT if the supplied record_version is not the task's
        current version, so a retry of a claim that already succeeded, sent with the earlier
        version, is a version conflict.
        Returns 409 CLAIM_NOT_APPLICABLE if the task's assignee_mode is single — claim exists
        only to establish a lead among multiple assignees (assignee_mode=all).
        The calling user's eligibility for the task's department and its stage's required level
        is read from Org & Membership before the write: 422 ASSIGNEE_INELIGIBLE when the read
        answers ineligible (a suspended, removed or demoted member) or the node has no stage in
        the compiled plan, 503 UPSTREAM_UNAVAILABLE when the read or the compiled plan fails.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/TaskIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [record_version]
              properties:
                record_version:
                  type: integer
                  minimum: 1
                  description: >
                    The task record_version the client last observed; required, and at least 1,
                    the lowest version a task can hold. A body that omits it or carries 0 is
                    refused 400 BAD_REQUEST. Any other value that is not the task's current
                    version returns RECORD_VERSION_CONFLICT.
                  example: 1
      responses:
        "202":
          description: Claim written; returns the updated task with its incremented record_version, once the transaction has committed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller has no active assignment for this task.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: "https://errors.bcbp.io/execution/not-assignee"
                title: "Not Assigned"
                status: 403
                detail: "caller is not the task's active assignee"
                instance: "/api/v1/tasks/3fa85f64-5717-4562-b3fc-2c963f66afa6/claim"
                code: "NOT_ASSIGNEE"
        "404":
          $ref: "#/components/responses/TaskNotFound"
        "409":
          description: >
            State conflict. See code field:
            TASK_ALREADY_CLAIMED — another assignee already holds the lead and the supplied version is current;
            RECORD_VERSION_CONFLICT — the supplied version is not the task's current one (another claim beat you, or this claim already succeeded);
            INVALID_TASK_STATE — the task is not in READY or IN_PROGRESS status;
            CLAIM_NOT_APPLICABLE — the task's assignee_mode is single, so claim does not apply;
            VERSION_INVALID — the eligibility check reads the compiled plan, and its schema version is not one this service reads.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                AlreadyClaimed:
                  value:
                    type: "https://errors.bcbp.io/execution/task-already-claimed"
                    title: "Task Already Claimed"
                    status: 409
                    detail: "task already claimed by another assignee"
                    instance: "/api/v1/tasks/3fa85f64-5717-4562-b3fc-2c963f66afa6/claim"
                    code: "TASK_ALREADY_CLAIMED"
                ClaimNotApplicable:
                  value:
                    type: "https://errors.bcbp.io/execution/claim-not-applicable"
                    title: "Claim Not Applicable"
                    status: 409
                    detail: "claim only applies to multi-assignee tasks"
                    instance: "/api/v1/tasks/3fa85f64-5717-4562-b3fc-2c963f66afa6/claim"
                    code: "CLAIM_NOT_APPLICABLE"
                ConcurrencyViolation:
                  value:
                    type: "https://errors.bcbp.io/execution/record-version-conflict"
                    title: "Record Version Conflict"
                    status: 409
                    detail: "record version conflict"
                    instance: "/api/v1/tasks/3fa85f64-5717-4562-b3fc-2c963f66afa6/claim"
                    code: "RECORD_VERSION_CONFLICT"
                IdempotencyReplay:
                  value:
                    type: "https://errors.bcbp.io/execution/idempotency-key-replay"
                    title: "Idempotency Key Replay"
                    status: 409
                    detail: "Idempotency-Key reused with a different request body"
                    instance: "/api/v1/tasks/3fa85f64-5717-4562-b3fc-2c963f66afa6/claim"
                    code: "IDEMPOTENCY_KEY_REPLAY"
        "422":
          description: The calling user is not eligible for this task.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: "https://errors.bcbp.io/execution/assignee-ineligible"
                title: "Assignee Ineligible"
                status: 422
                detail: "the user does not satisfy the task's department and role level"
                instance: "/api/v1/tasks/3fa85f64-5717-4562-b3fc-2c963f66afa6/claim"
                code: "ASSIGNEE_INELIGIBLE"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/tasks/{id}/complete:
    post:
      operationId: completeTask
      tags: [Tasks]
      summary: Complete a task assignment
      description: >
        The calling user, an active assignee who may act (the only assignee, or the lead of an
        assignee_mode=all task), submits the completion payload. A task in READY or
        IN_PROGRESS can be completed with no claim first; in assignee_mode=all only the lead
        may complete. The request forwards the completion to the workflow as a signal and
        answers 202 with the task as it stood when the signal was accepted. The workflow
        applies it afterwards: it records completed_at and result_json on the
        assignment, closes the co-assignees' open assignments and moves the task to COMPLETED
        as the instance moves on, so a client that needs the outcome reads the task again.
        The calling user's eligibility for the task's department and its stage's required level
        is read from Org & Membership before the signal: 422 ASSIGNEE_INELIGIBLE when the read
        answers ineligible (a suspended, removed or demoted member) or the node has no stage in
        the compiled plan, 503 UPSTREAM_UNAVAILABLE when the read or the compiled plan fails.
        A repeat that arrives while an earlier attempt for the same task has not yet sent its
        signal also answers 503 UPSTREAM_UNAVAILABLE (retry later, nothing was done); once the
        signal has gone out, a repeat answers 409 RECORD_VERSION_CONFLICT.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/TaskIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [record_version]
              properties:
                record_version:
                  type: integer
                  minimum: 1
                  description: >
                    The task record_version the client last observed; required, and at least 1.
                    A body that omits it or carries 0 is refused 400 BAD_REQUEST.
                  example: 1
                result_json:
                  type: object
                  additionalProperties: true
                  description: >
                    Completion payload from this assignee. Optional — not bound as
                    required by the handler. Schema is workflow-defined; the service
                    stores it opaquely. Included in the TaskCompleted event.
                  example:
                    approved: true
                    notes: "All documents are in order."
      responses:
        "202":
          description: >
            Completion accepted; returns the task as it stood when the signal was accepted,
            so status, record_version and assignment still show the earlier state and there is
            no completed_at. The workflow applies the completion after the response; read the
            task again for the outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            Caller has no active assignment for this task or, in an assignee_mode=all task,
            is not its lead.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: "https://errors.bcbp.io/execution/not-assignee"
                title: "Not Assigned"
                status: 403
                detail: "caller is not the task's active assignee"
                instance: "/api/v1/tasks/3fa85f64-5717-4562-b3fc-2c963f66afa6/complete"
                code: "NOT_ASSIGNEE"
        "404":
          $ref: "#/components/responses/TaskNotFound"
        "409":
          description: >
            State conflict. See code field:
            RECORD_VERSION_CONFLICT — version mismatch;
            INVALID_TASK_STATE — the task is not READY or IN_PROGRESS;
            INVALID_INSTANCE_STATE — the instance is not RUNNING or DEGRADED (for example paused), so the workflow would drop the completion;
            VERSION_INVALID — the eligibility check reads the compiled plan, and its schema version is not one this service reads;
            IDEMPOTENCY_KEY_REPLAY — same key reused with a different request body.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                IdempotencyReplay:
                  value:
                    type: "https://errors.bcbp.io/execution/idempotency-key-replay"
                    title: "Idempotency Key Replay"
                    status: 409
                    detail: "Idempotency-Key reused with a different request body"
                    instance: "/api/v1/tasks/3fa85f64-5717-4562-b3fc-2c963f66afa6/complete"
                    code: "IDEMPOTENCY_KEY_REPLAY"
        "422":
          description: The calling user is not eligible for this task.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: "https://errors.bcbp.io/execution/assignee-ineligible"
                title: "Assignee Ineligible"
                status: 422
                detail: "the user does not satisfy the task's department and role level"
                instance: "/api/v1/tasks/3fa85f64-5717-4562-b3fc-2c963f66afa6/complete"
                code: "ASSIGNEE_INELIGIBLE"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/tasks/{id}/defer:
    post:
      operationId: deferTask
      tags: [Tasks]
      summary: Defer a task (send it back)
      description: >
        The calling user, an active assignee who may act (the only assignee, or the lead of an
        assignee_mode=all task), defers the task — indicating it cannot
        proceed as-is (e.g. missing documents, incomplete prior step). The task status
        transitions to DEFERRED and the instance goes back one step, as an admin
        force-back does: the previous step's department runs again and creates a new
        task for it. The request waits for the workflow to apply the defer and answers
        200 with the deferred task, now DEFERRED. A task in READY or IN_PROGRESS can be
        deferred with no claim first; in assignee_mode=all only the lead may defer. The
        instance may be RUNNING or DEGRADED; on a DEGRADED instance the work goes back to the
        step before the fork and the failed branch is not rerun. Any other instance state
        answers 409 INVALID_INSTANCE_STATE before the Update is sent. A task that is not READY
        or IN_PROGRESS, or an instance with no completed step to go back to, answers 409
        INVALID_TASK_STATE naming the reason. Nothing changes on a refusal.
        The calling user's eligibility for the task's department and its stage's required level
        is read from Org & Membership before the Update: 422 ASSIGNEE_INELIGIBLE when the read
        answers ineligible (a suspended, removed or demoted member) or the node has no stage in
        the compiled plan, 503 UPSTREAM_UNAVAILABLE when the read or the compiled plan fails.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/TaskIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [record_version]
              properties:
                record_version:
                  type: integer
                  minimum: 1
                  description: >
                    The task record_version the client last observed; required, and at least 1.
                    A body that omits it or carries 0 is refused 400 BAD_REQUEST.
                  example: 1
                reason:
                  type: string
                  maxLength: 500
                  description: >
                    Human-readable reason for deferral. Optional — not bound as required
                    by the handler. Stored on the TaskDeferred event.
                  example: "Supporting documents are missing from the tender package."
      responses:
        "200":
          description: Defer applied; returns the deferred task (now in DEFERRED status).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            Caller has no active assignment for this task or, in an assignee_mode=all task,
            is not its lead.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: "https://errors.bcbp.io/execution/not-assignee"
                title: "Not Assigned"
                status: 403
                detail: "caller is not the task's active assignee"
                instance: "/api/v1/tasks/3fa85f64-5717-4562-b3fc-2c963f66afa6/defer"
                code: "NOT_ASSIGNEE"
        "404":
          $ref: "#/components/responses/TaskNotFound"
        "409":
          description: >
            RECORD_VERSION_CONFLICT — version mismatch;
            INVALID_TASK_STATE — the task is not READY or IN_PROGRESS, or the instance has no completed step to defer to;
            INVALID_INSTANCE_STATE — the instance is not RUNNING or DEGRADED;
            VERSION_INVALID — the eligibility check reads the compiled plan, and its schema version is not one this service reads;
            IDEMPOTENCY_KEY_REPLAY — same key reused with a different request body.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                IdempotencyReplay:
                  value:
                    type: "https://errors.bcbp.io/execution/idempotency-key-replay"
                    title: "Idempotency Key Replay"
                    status: 409
                    detail: "Idempotency-Key reused with a different request body"
                    instance: "/api/v1/tasks/3fa85f64-5717-4562-b3fc-2c963f66afa6/defer"
                    code: "IDEMPOTENCY_KEY_REPLAY"
        "422":
          description: The calling user is not eligible for this task.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: "https://errors.bcbp.io/execution/assignee-ineligible"
                title: "Assignee Ineligible"
                status: 422
                detail: "the user does not satisfy the task's department and role level"
                instance: "/api/v1/tasks/3fa85f64-5717-4562-b3fc-2c963f66afa6/defer"
                code: "ASSIGNEE_INELIGIBLE"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/tasks/{id}/reassign:
    post:
      operationId: reassignTask
      tags: [Tasks]
      summary: Reassign a task to a different user (admin)
      description: >
        Admin override: vacates the current active assignment(s) and creates a new assignment
        for the specified user. Sends an instance-reassign signal to Temporal. The body
        carries new_user_id and record_version only; a reason is not accepted, and a body with
        any other field is refused 400 BAD_REQUEST naming it. A reassign of a connector-typed
        task is refused 409 TASK_NOT_HUMAN_ACTIONABLE before the version and status checks.
        A task with no active assignee is accepted and treated as having no current holder.
        The new assignee's eligibility for the node is checked before the signal, as for
        node-override (§5.4): 422 ASSIGNEE_INELIGIBLE when the Org & Membership read answers
        ineligible or the node has no stage in the compiled plan, 503 UPSTREAM_UNAVAILABLE when
        the read fails.
        A task with no active assignee (for example after its only assignee was removed) is
        accepted and given to the new user; the reassign then names no previous user.
        Returns 400 OVERRIDE_NO_OP if new_user_id is already the current assignee.
      security:
        - GatewayTenantContext: []
          UserContext: []
          AdminRole: []
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/TenantRolesHeader"
        - $ref: "#/components/parameters/TaskIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [new_user_id, record_version]
              properties:
                new_user_id:
                  type: string
                  format: uuid
                  description: UUID of the user who takes the task.
                record_version:
                  type: integer
                  minimum: 1
                  description: >
                    The caller's current view of the task's record_version, checked
                    synchronously before the signal is forwarded (§5.10); required, and at
                    least 1. A body that omits it or carries 0 is refused 400 BAD_REQUEST.
                  example: 2
      responses:
        "202":
          description: >
            Reassignment accepted; returns the task as it stood when the signal was accepted.
            The workflow applies the change after the response, so the body still shows the
            earlier assignment; read the task again for the outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskActionResult"
        "400":
          description: >
            Malformed request body (a field this operation does not define included), or code
            field OVERRIDE_NO_OP — new_user_id is already the current assignee.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                BadRequest:
                  value:
                    type: "https://errors.bcbp.io/execution/bad-request"
                    title: "Bad Request"
                    status: 400
                    detail: "request body has missing or invalid fields"
                    instance: "/api/v1/tasks/3fa85f64-5717-4562-b3fc-2c963f66afa6/reassign"
                    code: "BAD_REQUEST"
                    invalid_params:
                      - name: "new_user_id"
                        reason: "is required"
                OverrideNoOp:
                  value:
                    type: "https://errors.bcbp.io/execution/override-no-op"
                    title: "Override No-Op"
                    status: 400
                    detail: "new assignee is already the current assignee"
                    instance: "/api/v1/tasks/3fa85f64-5717-4562-b3fc-2c963f66afa6/reassign"
                    code: "OVERRIDE_NO_OP"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/TaskNotFound"
        "409":
          description: >
            State conflict. See code field:
            TASK_NOT_HUMAN_ACTIONABLE — the task is connector-typed;
            INVALID_TASK_STATE — task is already COMPLETED, DEFERRED, or FAILED;
            INVALID_INSTANCE_STATE — the instance is not RUNNING or DEGRADED;
            VERSION_INVALID — the eligibility check reads the compiled plan, and its schema version is not one this service reads;
            RECORD_VERSION_CONFLICT — record_version is stale;
            IDEMPOTENCY_KEY_REPLAY — same key reused with a different request body.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                RecordVersionConflict:
                  value:
                    type: "https://errors.bcbp.io/execution/record-version-conflict"
                    title: "Record Version Conflict"
                    status: 409
                    detail: "record version conflict"
                    instance: "/api/v1/tasks/3fa85f64-5717-4562-b3fc-2c963f66afa6/reassign"
                    code: "RECORD_VERSION_CONFLICT"
                IdempotencyReplay:
                  value:
                    type: "https://errors.bcbp.io/execution/idempotency-key-replay"
                    title: "Idempotency Key Replay"
                    status: 409
                    detail: "Idempotency-Key reused with a different request body"
                    instance: "/api/v1/tasks/3fa85f64-5717-4562-b3fc-2c963f66afa6/reassign"
                    code: "IDEMPOTENCY_KEY_REPLAY"
        "422":
          description: The new assignee is not eligible for this task's node.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: "https://errors.bcbp.io/execution/assignee-ineligible"
                title: "Assignee Ineligible"
                status: 422
                detail: "the user does not satisfy the task's department and role level"
                instance: "/api/v1/tasks/3fa85f64-5717-4562-b3fc-2c963f66afa6/reassign"
                code: "ASSIGNEE_INELIGIBLE"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/workflows/active-by-user:
    get:
      operationId: getActiveTasksByUser
      tags: [Tasks]
      summary: Get active task assignments for a user (admin / IAM reconciliation)
      description: >
        Returns all READY and IN_PROGRESS task assignments for the specified user across
        all workflow instances. Used by IAM SQS handlers (delegation, user deletion) to
        determine which tasks need to be reassigned, and by admin UIs for user activity audits.
      security:
        - GatewayTenantContext: []
          UserContext: []
          AdminRole: []
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/TenantRolesHeader"
        - name: user_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the user whose active assignments to retrieve.
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Keyset page of active task assignments for the specified user (§5.9).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ActiveUserTask"
                  next_cursor:
                    type: string
                    nullable: true
                    description: Opaque cursor for the next page; omitted/null on the final page.
        "400":
          description: Missing or invalid user_id query parameter; the detail is "invalid user_id query parameter".
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
