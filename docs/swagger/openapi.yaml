                instance: "/api/v1/workflows/active-by-user"
                code: "BAD_REQUEST"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  # internal, service-to-service caller — shared Workflow-Events Consumer
  /api/v1/internal/events:
    post:
      operationId: ingestInternalEvent
      tags: [Internal (Events)]
      summary: Ingest a forwarded domain-event envelope
      description: >
        Service-to-service ingest endpoint called by the shared Workflow-Events Consumer,
        which subscribes Execution's inbound SNS topics (iam.membership.events,
        iam.user.events, wf.template.events, §6.1) and forwards each envelope here over
        HTTP, exactly as it does for Definition Service. Sets the RLS GUC from the
        envelope's tenant_id and dispatches by type (§6.2). Idempotent: a repeated envelope
        id (paired with a fixed per-subscription consumer name) returns 2xx with no side
        effects. An unrecognized type is accepted and ignored with 200, never an error. Not
        exposed on the public Envoy gateway; carries no gateway identity headers.
      security:
        - InternalServiceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventEnvelope" }
      responses:
        "200":
          description: >
            Event processed, or an idempotent no-op for an already-seen envelope id, or an
            unrecognized type accepted and ignored. No response body in any case.
        "400":
          description: Malformed envelope or payload — non-retryable, the consumer routes to its DLQ.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          description: >
            Transient processing failure. The consumer retries until the queue's
            maxReceiveCount (5) moves the message to its DLQ.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "502":
          description: >
            EVENT_DECODE_FAILED — the envelope carries a dataschema (schema-registry payload)
            that could not be decoded: a missing/misconfigured decoder, or a schema-registry
            decode failure. Retryable infra problem, never a malformed client payload — the
            consumer must retry this rather than route it to its DLQ.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: "https://errors.bcbp.io/execution/event-decode-failed"
                title: "Event Decode Failed"
                status: 502
                detail: "schema-registry payload decode failed"
                instance: "/api/v1/internal/events"
                code: "EVENT_DECODE_FAILED"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

