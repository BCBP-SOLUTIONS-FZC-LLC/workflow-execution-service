# CI for https://github.com/BCBP-SOLUTIONS-FZC-LLC/workflow-execution-service

name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  IMAGE_BASE: ghcr.io/bcbp-solutions-fzc-llc/workflow-execution-service

jobs:
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.decide.outputs.run }}
      docs_only: ${{ steps.docs.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # docs_only is true when every changed file is documentation: Markdown,
      # Mermaid, .claude/, docs/ (except the API spec under docs/swagger/) or
      # LICENSE. The required checks then report skipped instead of running.
      - id: docs
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          docs_only=false
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ] &&
            files="$(git diff --name-only "$BASE...$HEAD" 2>/dev/null)" && [ -n "$files" ]; then
            code="$(while read -r f; do
              case "$f" in
                docs/swagger/*) echo "$f" ;;
                *.md | *.mmd | .claude/* | docs/* | LICENSE) ;;
                *) echo "$f" ;;
              esac
            done <<<"$files")"
            [ -z "$code" ] && docs_only=true
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only"

      - id: decide
        run: >
          echo "run=${{
            github.event_name != 'pull_request' ||
            (github.event.pull_request.draft == false &&
             !contains(github.event.pull_request.labels.*.name, 'skip-ci'))
          }}" >> "$GITHUB_OUTPUT"

  validate-quality:
    name: Validate / Quality
    needs: [ci-gate]
    if: needs.ci-gate.outputs.run == 'true'
    uses: ./.github/workflows/validate-quality.yml
    secrets: inherit
    with:
      docs_only: ${{ needs.ci-gate.outputs.docs_only == 'true' }}

  validate-test:
    name: Validate / Test
    needs: [ci-gate]
    if: needs.ci-gate.outputs.run == 'true'
    uses: ./.github/workflows/validate-test.yml
    secrets: inherit
    with:
      docs_only: ${{ needs.ci-gate.outputs.docs_only == 'true' }}

  build-image-cache:
    name: Build image (cache)
    needs: [ci-gate]
    if: needs.ci-gate.outputs.run == 'true' && needs.ci-gate.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            go.mod

      - name: Cache sqlc
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/bin
          key: sqlc-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Generate (sqlc)
        run: |
          [ -x "$RUNNER_TEMP/bin/sqlc" ] || GOBIN="$RUNNER_TEMP/bin" go install "github.com/sqlc-dev/sqlc/cmd/sqlc@$(awk '/^SQLC_VERSION/ {print $3}' Makefile)"
          make generate-sqlc SQLC="$RUNNER_TEMP/bin/sqlc"

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

      - name: Check that no credential stays in a layer or a registry cache
        run: scripts/dockerfile-credentials-check.sh

      - uses: docker/setup-buildx-action@v3

      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: server
          push: false
          load: true
          tags: ${{ env.IMAGE_BASE }}-server:${{ github.sha }}
          build-args: BUILD_VERSION=${{ github.sha }}
          secrets: go_private_token=${{ secrets.GO_PRIVATE_TOKEN }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: false
          load: true
          tags: ${{ env.IMAGE_BASE }}-worker:${{ github.sha }}
          build-args: BUILD_VERSION=${{ github.sha }}
          secrets: go_private_token=${{ secrets.GO_PRIVATE_TOKEN }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: Build connector-worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: connector-worker
          push: false
          load: true
          tags: ${{ env.IMAGE_BASE }}-connector-worker:${{ github.sha }}
          build-args: BUILD_VERSION=${{ github.sha }}
          secrets: go_private_token=${{ secrets.GO_PRIVATE_TOKEN }}
          cache-from: type=gha,scope=connector-worker
          cache-to: type=gha,mode=max,scope=connector-worker

  trivy-cve-scan:
    name: Trivy CVE scan
    needs: [build-image-cache]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            go.mod

      - name: Cache sqlc
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/bin
          key: sqlc-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Generate (sqlc)
        run: |
          [ -x "$RUNNER_TEMP/bin/sqlc" ] || GOBIN="$RUNNER_TEMP/bin" go install "github.com/sqlc-dev/sqlc/cmd/sqlc@$(awk '/^SQLC_VERSION/ {print $3}' Makefile)"
          make generate-sqlc SQLC="$RUNNER_TEMP/bin/sqlc"

      - uses: docker/setup-buildx-action@v3

      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: server
          push: false
          load: true
          tags: ${{ env.IMAGE_BASE }}-server:${{ github.sha }}
          build-args: BUILD_VERSION=${{ github.sha }}
          secrets: go_private_token=${{ secrets.GO_PRIVATE_TOKEN }}
          cache-from: type=gha,scope=server

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: false
          load: true
          tags: ${{ env.IMAGE_BASE }}-worker:${{ github.sha }}
          build-args: BUILD_VERSION=${{ github.sha }}
          secrets: go_private_token=${{ secrets.GO_PRIVATE_TOKEN }}
          cache-from: type=gha,scope=worker

      - name: Build connector-worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: connector-worker
          push: false
          load: true
          tags: ${{ env.IMAGE_BASE }}-connector-worker:${{ github.sha }}
          build-args: BUILD_VERSION=${{ github.sha }}
          secrets: go_private_token=${{ secrets.GO_PRIVATE_TOKEN }}
          cache-from: type=gha,scope=connector-worker

      - name: Install Trivy
        env:
          TRIVY_VERSION: 0.70.0
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/trivy-bin"
          mkdir -p "$dir"
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL -o "$dir/$archive" "$base/$archive"
          curl -fsSL -o "$dir/checksums.txt" "$base/trivy_${TRIVY_VERSION}_checksums.txt"
          (cd "$dir" && grep " ${archive}\$" checksums.txt | sha256sum -c -)
          tar -xzf "$dir/$archive" -C "$dir" trivy
          echo "$dir" >> "$GITHUB_PATH"

      - name: Scan server image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          skip-setup-trivy: true
          image-ref: ${{ env.IMAGE_BASE }}-server:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          cache-dir: .trivy-cache

      - name: Scan worker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          skip-setup-trivy: true
          image-ref: ${{ env.IMAGE_BASE }}-worker:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          cache-dir: .trivy-cache

      - name: Scan connector-worker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          skip-setup-trivy: true
          image-ref: ${{ env.IMAGE_BASE }}-connector-worker:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          cache-dir: .trivy-cache

  smoke-tests:
    name: Smoke tests
    needs: [validate-test, build-image-cache]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            go.mod

      - name: Cache sqlc
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/bin
          key: sqlc-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Generate (sqlc)
        run: |
          [ -x "$RUNNER_TEMP/bin/sqlc" ] || GOBIN="$RUNNER_TEMP/bin" go install "github.com/sqlc-dev/sqlc/cmd/sqlc@$(awk '/^SQLC_VERSION/ {print $3}' Makefile)"
          make generate-sqlc SQLC="$RUNNER_TEMP/bin/sqlc"

      - uses: docker/setup-buildx-action@v3

      - name: Rebuild all images from cache
        env:
          GO_PRIVATE_TOKEN: ${{ secrets.GO_PRIVATE_TOKEN }}
        run: |
          for t in server worker connector-worker; do
            docker buildx build --target "$t" --load \
              --build-arg BUILD_VERSION=${{ github.sha }} \
              --secret id=go_private_token,env=GO_PRIVATE_TOKEN \
              --cache-from type=gha,scope="$t" \
              -t "${{ env.IMAGE_BASE }}-$t:${{ github.sha }}" .
          done

      - name: migrate subcommand applies the schema
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable \
            "${{ env.IMAGE_BASE }}-server:${{ github.sha }}" migrate

      # `version` is handled before any configuration is read, so this needs
      # no environment: it checks the one thing this step is for — the
      # entrypoint resolves and the binary loads in its runtime stage. Every
      # other entrypoint legitimately requires DATABASE_URL and friends and
      # would exit 1 here regardless of image health.
      - name: Each image's entrypoint runs
        run: |
          for t in server worker connector-worker; do
            docker run --rm "${{ env.IMAGE_BASE }}-$t:${{ github.sha }}" version
          done

  push-image-ghcr:
    name: Push image → GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate-test, validate-quality, trivy-cve-scan, smoke-tests]
    strategy:
      matrix:
        target: [server, worker, connector-worker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write # Cosign keyless signing (Sigstore OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            go.mod

      - name: Cache sqlc
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/bin
          key: sqlc-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Generate (sqlc)
        run: |
          [ -x "$RUNNER_TEMP/bin/sqlc" ] || GOBIN="$RUNNER_TEMP/bin" go install "github.com/sqlc-dev/sqlc/cmd/sqlc@$(awk '/^SQLC_VERSION/ {print $3}' Makefile)"
          make generate-sqlc SQLC="$RUNNER_TEMP/bin/sqlc"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.target }} image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-${{ matrix.target }}:${{ github.sha }}
            ${{ env.IMAGE_BASE }}-${{ matrix.target }}:latest
          build-args: BUILD_VERSION=${{ github.sha }}
          secrets: go_private_token=${{ secrets.GO_PRIVATE_TOKEN }}
          cache-from: type=gha,scope=${{ matrix.target }}

      - uses: sigstore/cosign-installer@v3

      - name: Sign and verify image (Cosign keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          ref="${{ env.IMAGE_BASE }}-${{ matrix.target }}@${DIGEST}"
          cosign sign --yes "$ref"
          cosign verify "$ref" \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/\.github/workflows/ci\.yml@refs/heads/main$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

  pr-summary:
    name: PR summary
    if: always() && github.event_name == 'pull_request'
    needs: [ci-gate, validate-quality, validate-test, build-image-cache, trivy-cve-scan, smoke-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - uses: actions/download-artifact@v4
        with:
          name: coverage
          path: .coverage
        continue-on-error: true

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Compute coverage percentage
        id: cov
        run: |
          if [ -f .coverage/coverage.out ]; then
            pct=$(go tool cover -func=.coverage/coverage.out | tail -1 | awk '{print $3}')
          else
            pct="n/a"
          fi
          echo "pct=$pct" >> "$GITHUB_OUTPUT"

      - uses: actions/github-script@v7
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          COVERAGE_PCT: ${{ steps.cov.outputs.pct }}
        with:
          script: |
            const prSummary = require('./.github/scripts/pr-summary.js');
            await prSummary({ github, context });
