name: Changelog Check

on:
  pull_request:
    paths:
      - 'internal/**'
      - 'api/**'
      - 'cmd/**'
      - 'deploy/**'

permissions:
  contents: read

jobs:
  changelog:
    name: CHANGELOG updated
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Verify CHANGELOG.md changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -qx 'CHANGELOG.md'; then
            echo "This PR touches internal/, api/, cmd/, or deploy/ but does not update CHANGELOG.md."
            echo "Add an entry under '## [Unreleased]'."
            exit 1
          fi
