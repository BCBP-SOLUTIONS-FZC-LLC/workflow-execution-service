name: Validate / Test

"on":
  workflow_call:
    inputs:
      compat_peer_ref:
        description: 'Branch or tag of the Definition Service the compat job runs against; empty means the branch named like this one if the Definition Service has it, otherwise main'
        type: string
        required: false
        default: ''
      compat_consumer_ref:
        description: 'Branch or tag of the Workflow-Events Consumer the compat job runs; empty means the branch named like this one if the Workflow-Events Consumer has it, otherwise main'
        type: string
        required: false
        default: ''

permissions:
  contents: read
  packages: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  GOPRIVATE: github.com/BCBP-SOLUTIONS-FZC-LLC/*
  GONOSUMDB: github.com/BCBP-SOLUTIONS-FZC-LLC/*

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            go.mod

      - name: Configure private module access
        env:
          GO_PRIVATE_TOKEN: ${{ secrets.GO_PRIVATE_TOKEN }}
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${GO_PRIVATE_TOKEN}@github.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials

      - name: Download modules
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Install dev tools
        run: make tools

      - name: Generate (sqlc)
        run: make generate

      - name: Build
        run: make build

      - name: Tests — unit + integration (race + coverage)
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_EC2_METADATA_DISABLED: 'true'
          TESTCONTAINERS_RYUK_DISABLED: 'true'
        run: make test-ci

      - name: Coverage threshold gate
        run: make cover-check-pkg

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: .coverage/coverage.out
          if-no-files-found: ignore

      - name: Architecture lint
        run: make arch-lint

  compat:
    name: compat
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_EC2_METADATA_DISABLED: 'true'
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Resolve the Definition Service ref
        id: peer
        env:
          PEER_REF: ${{ inputs.compat_peer_ref }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          READ_TOKEN: ${{ secrets.CI_REPO_READ_TOKEN || secrets.GO_PRIVATE_TOKEN }}
        run: |
          set -euo pipefail
          ref="$PEER_REF"
          if [ -z "$ref" ]; then
            ref=main
            if git ls-remote --exit-code --heads "https://x-access-token:${READ_TOKEN}@github.com/BCBP-SOLUTIONS-FZC-LLC/workflow-definition-service.git" "refs/heads/${HEAD_REF}" >/dev/null 2>&1; then
              ref="$HEAD_REF"
            fi
          fi
          echo "Definition Service ref: ${ref}"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Checkout the Definition Service
        uses: actions/checkout@v7
        with:
          repository: BCBP-SOLUTIONS-FZC-LLC/workflow-definition-service
          ref: ${{ steps.peer.outputs.ref }}
          path: peer/definition_service
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || secrets.GO_PRIVATE_TOKEN }}

      - name: Resolve the Workflow-Events Consumer ref
        id: consumer
        env:
          CONSUMER_REF: ${{ inputs.compat_consumer_ref }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          READ_TOKEN: ${{ secrets.CI_REPO_READ_TOKEN || secrets.GO_PRIVATE_TOKEN }}
        run: |
          set -euo pipefail
          ref="$CONSUMER_REF"
          if [ -z "$ref" ]; then
            ref=main
            if git ls-remote --exit-code --heads "https://x-access-token:${READ_TOKEN}@github.com/BCBP-SOLUTIONS-FZC-LLC/workflow-event-consumer.git" "refs/heads/${HEAD_REF}" >/dev/null 2>&1; then
              ref="$HEAD_REF"
            fi
          fi
          echo "Workflow-Events Consumer ref: ${ref}"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Checkout the Workflow-Events Consumer
        uses: actions/checkout@v7
        with:
          repository: BCBP-SOLUTIONS-FZC-LLC/workflow-event-consumer
          ref: ${{ steps.consumer.outputs.ref }}
          path: peer/event_consumer
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || secrets.GO_PRIVATE_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            go.mod
            peer/definition_service/go.sum
            peer/event_consumer/go.sum

      - name: Configure private module access
        env:
          GO_PRIVATE_TOKEN: ${{ secrets.GO_PRIVATE_TOKEN }}
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${GO_PRIVATE_TOKEN}@github.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials

      - name: Generate (sqlc) for both services
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install "github.com/sqlc-dev/sqlc/cmd/sqlc@$(awk '/^SQLC_VERSION/ {print $3}' Makefile)"
          make generate-sqlc SQLC="$RUNNER_TEMP/bin/sqlc"
          make -C peer/definition_service generate-sqlc SQLC="$RUNNER_TEMP/bin/sqlc"

      - name: Compatibility with the Definition Service
        run: make test-compat DEFINITION_SERVICE_DIR="$GITHUB_WORKSPACE/peer/definition_service" EVENT_CONSUMER_DIR="$GITHUB_WORKSPACE/peer/event_consumer"

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_EC2_METADATA_DISABLED: 'true'
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            go.mod

      - name: Configure private module access
        env:
          GO_PRIVATE_TOKEN: ${{ secrets.GO_PRIVATE_TOKEN }}
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${GO_PRIVATE_TOKEN}@github.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials

      - name: Generate (sqlc)
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install "github.com/sqlc-dev/sqlc/cmd/sqlc@$(awk '/^SQLC_VERSION/ {print $3}' Makefile)"
          make generate-sqlc SQLC="$RUNNER_TEMP/bin/sqlc"

      - name: End-to-end (Temporal, Postgres, Valkey, HTTP)
        run: make test-e2e
