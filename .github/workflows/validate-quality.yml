name: Validate / Quality

"on":
  workflow_call:

permissions:
  contents: read
  packages: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  GOPRIVATE: github.com/BCBP-SOLUTIONS-FZC-LLC/*
  GONOSUMDB: github.com/BCBP-SOLUTIONS-FZC-LLC/*

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}
          fetch-depth: 0 # the contract breaking-change gate reads main's spec

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            go.mod

      - uses: azure/setup-helm@v4

      - name: Configure private module access
        env:
          GO_PRIVATE_TOKEN: ${{ secrets.GO_PRIVATE_TOKEN }}
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${GO_PRIVATE_TOKEN}@github.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials

      - name: Download modules
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Install dev tools
        run: make tools

      - name: Generate (sqlc and mocks)
        run: |
          make generate
          make mock

      - name: Format check
        run: make fmt-check

      - name: Tidy check
        run: |
          make tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error file=go.mod,title=Module drift::go.mod or go.sum is stale — run 'go mod tidy' and commit the result."
            exit 1
          fi

      - name: Interpreter semantics changeID check
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD -- internal/workflow \
            | grep -v '_test\.go$' | grep -v '/version\.go$' || true)
          TOUCHED_VERSION=$(git diff --name-only "$BASE"...HEAD -- internal/workflow/version.go)
          if [ -n "$CHANGED" ] && [ -z "$TOUCHED_VERSION" ]; then
            if ! grep -qi 'no semantic change' <<<"$PR_BODY"; then
              echo "::error title=Missing changeID::internal/workflow/*.go changed without touching version.go. If this changes interpretation of already-recorded DSL data, add a new changeID (see test/workflow/replay/README.md). Otherwise state \"no semantic change\" in the PR description."
              exit 1
            fi
          fi

      - name: Vet
        run: go vet ./cmd/... ./internal/...

      - name: Lint
        run: make lint

      - name: Observability standard lint
        run: make metrics-lint

      - name: Vulnerability check
        run: make vuln

      # The internal spec must not break its callers (LLD §5.3).
      - name: Contract breaking-change gate
        env:
          CONTRACT_BASE_REF: origin/main
        run: make contract-breaking

      # The copy of the Definition Service's spec must match its source.
      - name: Contract copy check
        env:
          GH_TOKEN: ${{ secrets.GO_PRIVATE_TOKEN }}
        run: make contract-check

      - name: Dockerfile base image digest check
        run: |
          if grep -E '^FROM [^ @]+:[^ @]+( AS .+)?$' Dockerfile; then
            echo "::error file=Dockerfile,title=Unpinned base image::Dockerfile FROM lines must use digest-pinned references (e.g. golang:1.26-alpine@sha256:...). Run 'make pin-base-images' to update."
            exit 1
          fi
          echo "Dockerfile base images are digest-pinned."

      - name: Helm chart lint + kubeconform
        run: make helm-lint

      - name: Lint GitHub Actions workflows
        run: make lint-workflows
