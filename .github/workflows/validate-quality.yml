# Reusable workflow — quality gate.
# generate (buf + sqlc, inline — not a separate job) · fmt · tidy · vet ·
# lint (golangci-lint) · vuln-check · buf lint.
# Called by ci.yml. Does not gate validate-test.yml — they run in parallel.
name: Validate / Quality

"on":
  workflow_call:

permissions:
  contents: read
  packages: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  GOPRIVATE: github.com/BCBP-SOLUTIONS-FZC-LLC/*
  GONOSUMDB: github.com/BCBP-SOLUTIONS-FZC-LLC/*

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            go.mod

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure private module access
        env:
          GO_PRIVATE_TOKEN: ${{ secrets.GO_PRIVATE_TOKEN }}
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${GO_PRIVATE_TOKEN}@github.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials

      - name: Download modules
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Install dev tools
        run: make tools

      # Duplicated inline in validate-test.yml too — only 2 jobs need generated
      # code at this Tier, so no dedicated generate job/artifact yet. See
      # .claude/CLAUDE.local.md for the threshold rule.
      - name: Generate (buf + sqlc)
        run: make generate

      - name: Format check
        run: make fmt-check

      - name: Tidy check
        run: |
          make tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error file=go.mod,title=Module drift::go.mod or go.sum is stale — run 'go mod tidy' and commit the result."
            exit 1
          fi

      # Warn-and-require-acknowledgment, not a static analyzer: a PR that
      # changes internal/workflow's interpreter semantics without touching
      # version.go must say so explicitly. See test/workflow/replay/README.md.
      - name: Interpreter semantics changeID check
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD -- internal/workflow \
            | grep -v '_test\.go$' | grep -v '/version\.go$' || true)
          TOUCHED_VERSION=$(git diff --name-only "$BASE"...HEAD -- internal/workflow/version.go)
          if [ -n "$CHANGED" ] && [ -z "$TOUCHED_VERSION" ]; then
            if ! grep -qi 'no semantic change' <<<"$PR_BODY"; then
              echo "::error title=Missing changeID::internal/workflow/*.go changed without touching version.go. If this changes interpretation of already-recorded DSL data, add a new changeID (see test/workflow/replay/README.md). Otherwise state \"no semantic change\" in the PR description."
              exit 1
            fi
          fi

      - name: Vet
        run: go vet ./cmd/... ./internal/...

      - name: Lint
        run: make lint

      - name: Vulnerability check
        run: make vuln

      # Uses the `buf` binary installed by bufbuild/buf-setup-action (on PATH),
      # not .tools/buf — buf-setup-action already gives us a pinned version.
      - name: Proto lint
        run: buf lint
