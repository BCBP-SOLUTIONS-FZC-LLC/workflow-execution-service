# Reusable workflow — quality gate.
# generate (buf + sqlc, inline — not a separate job) · fmt · tidy · vet ·
# lint (golangci-lint) · vuln-check · buf lint · buf breaking · Dockerfile
# digest-pin check · Helm chart lint + kubeconform validation · actionlint.
# Called by ci.yml. Does not gate validate-test.yml — they run in parallel.
name: Validate / Quality

"on":
  workflow_call:

permissions:
  contents: read
  packages: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  GOPRIVATE: github.com/BCBP-SOLUTIONS-FZC-LLC/*
  GONOSUMDB: github.com/BCBP-SOLUTIONS-FZC-LLC/*

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}
          fetch-depth: 0 # buf breaking --against '.git#branch=main' needs main's history

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            go.mod

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: azure/setup-helm@v4

      - name: Configure private module access
        env:
          GO_PRIVATE_TOKEN: ${{ secrets.GO_PRIVATE_TOKEN }}
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${GO_PRIVATE_TOKEN}@github.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials

      - name: Download modules
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Install dev tools
        run: make tools

      # Duplicated inline in validate-test.yml too — only 2 jobs need generated
      # code at this Tier, so no dedicated generate job/artifact yet. See
      # .claude/CLAUDE.local.md for the threshold rule.
      - name: Generate (buf + sqlc)
        run: make generate

      - name: Format check
        run: make fmt-check

      - name: Tidy check
        run: |
          make tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error file=go.mod,title=Module drift::go.mod or go.sum is stale — run 'go mod tidy' and commit the result."
            exit 1
          fi

      - name: Vet
        run: go vet ./cmd/... ./internal/...

      - name: Lint
        run: make lint

      - name: Vulnerability check
        run: make vuln

      # Uses the `buf` binary installed by bufbuild/buf-setup-action (on PATH),
      # not .tools/buf — buf-setup-action already gives us a pinned version.
      - name: Proto lint
        run: buf lint

      # LLD §6.9 commits to this gate; buf.yaml already configures
      # `breaking: use: [FILE]` but nothing invoked it before this task.
      - name: Proto breaking-change check
        run: buf breaking --against '.git#branch=main'

      # Enforce digest-pinned FROM lines in the Dockerfile. Floating tags
      # (e.g. golang:1.26-alpine without @sha256:...) can be silently
      # overwritten upstream, breaking supply-chain guarantees. Run
      # `make pin-base-images` to update the pinned digests.
      - name: Dockerfile base image digest check
        run: |
          if grep -E '^FROM [^ @]+:[^ @]+( AS .+)?$' Dockerfile; then
            echo "::error file=Dockerfile,title=Unpinned base image::Dockerfile FROM lines must use digest-pinned references (e.g. golang:1.26-alpine@sha256:...). Run 'make pin-base-images' to update."
            exit 1
          fi
          echo "Dockerfile base images are digest-pinned."

      - name: Helm chart lint + kubeconform
        run: make helm-lint

      - name: Lint GitHub Actions workflows
        run: make lint-workflows
