# Tag-triggered release: generate → validate-quality + validate-test → build
# → docker (semver-tagged, per-process, Cosign keyless signed) → deploy-gate
# → release. Mirrors definition_service's release.yml shape, extended to two
# independently-gated Deployments sharing one Helm release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  IMAGE_BASE: ghcr.io/bcbp-solutions-fzc-llc/workflow-execution-service

jobs:
  validate-quality:
    name: Validate / Quality
    uses: ./.github/workflows/validate-quality.yml
    secrets: inherit

  validate-test:
    name: Validate / Test
    uses: ./.github/workflows/validate-test.yml
    secrets: inherit

  build:
    name: Build binaries
    needs: [validate-quality, validate-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            go.mod

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure private module access
        env:
          GO_PRIVATE_TOKEN: ${{ secrets.GO_PRIVATE_TOKEN }}
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${GO_PRIVATE_TOKEN}@github.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials

      - name: Install dev tools
        run: make tools

      - name: Generate (buf + sqlc)
        run: make generate

      - name: Build
        run: make build

  docker:
    name: Build, push, sign image
    needs: [build]
    strategy:
      matrix:
        target: [server, worker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write # Cosign keyless signing (Sigstore OIDC)
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Resolve version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.target }} image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-${{ matrix.target }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_BASE }}-${{ matrix.target }}:latest
          build-args: BUILD_VERSION=${{ steps.version.outputs.version }}
          secrets: go_private_token=${{ secrets.GO_PRIVATE_TOKEN }}

      - uses: sigstore/cosign-installer@v3

      - name: Sign and verify image (Cosign keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          ref="${{ env.IMAGE_BASE }}-${{ matrix.target }}@${DIGEST}"
          cosign sign --yes "$ref"
          cosign verify "$ref" \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/tags/.*$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

  # A partial push (one target published, one not) blocks this entirely —
  # needs: [docker] with a matrix means any failed matrix instance skips
  # this job automatically, satisfying the "atomic upgrade must never
  # reference a tag that didn't actually publish" rule.
  deploy-gate:
    name: Post-deploy health gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [docker]
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Verify KUBECONFIG_B64 is configured
        run: |
          if [ -z "${{ secrets.KUBECONFIG_B64 }}" ]; then
            echo "::error::KUBECONFIG_B64 secret is not set. Configure the kubeconfig for the production cluster before tagging releases."
            exit 1
          fi

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - uses: azure/setup-helm@v4
      - uses: docker/setup-buildx-action@v3

      - name: Deploy with Helm (both Deployments, one atomic release)
        env:
          IMAGE_VERSION: ${{ needs.docker.outputs.version }}
          K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'workflow-app' }}
        run: |
          helm upgrade workflow-execution-service ./deploy/helm \
            --install \
            --wait \
            --timeout=5m \
            --namespace="$K8S_NAMESPACE" \
            --set image.tag="$IMAGE_VERSION" \
            --set-string secret.secretValues.DATABASE_URL="${{ secrets.PROD_DATABASE_URL }}" \
            --set-string secret.secretValues.TEMPORAL_HOST_PORT="${{ vars.PROD_TEMPORAL_HOST_PORT }}" \
            --atomic

      - name: Verify deployed image digests
        env:
          IMAGE_VERSION: ${{ needs.docker.outputs.version }}
          K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'workflow-app' }}
        run: |
          for target in server:api worker:worker; do
            image="${target%%:*}"; component="${target##*:}"
            expected=$(docker buildx imagetools inspect \
              "${{ env.IMAGE_BASE }}-${image}:${IMAGE_VERSION}" --format '{{json .Manifest}}' | jq -r '.digest')
            actual=$(kubectl get deployment "workflow-execution-service-${component}" \
              --namespace="$K8S_NAMESPACE" \
              -o jsonpath='{.spec.template.spec.containers[0].image}')
            echo "Expected digest ($component): ${expected}"
            echo "Deployed image ($component):  ${actual}"
            if [[ "$actual" == *"@sha256:"* ]]; then
              actual_digest="${actual#*@}"
              if [ "$actual_digest" != "$expected" ]; then
                echo "::error::Deployed $component image digest ${actual_digest} does not match published digest ${expected} — potential supply-chain substitution."
                exit 1
              fi
            fi
          done

      # Two independent gates, since the API and Worker Deployments can each
      # regress independently (LLD §10.3, §7.6). A breach rolls back only
      # its own Deployment via `kubectl rollout undo` — NOT `helm rollback`,
      # which would roll back the whole release (both Deployments) since
      # Helm's rollback history is release-scoped, not per-resource.
      - name: Health gate — API 5xx rate < 1% for 2 minutes
        env:
          PROM_URL: ${{ vars.PROMETHEUS_URL }}
          K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'workflow-app' }}
        run: |
          if [ -z "$PROM_URL" ]; then
            echo "PROMETHEUS_URL not set — skipping API error-rate check"
            exit 0
          fi
          QUERY='sum(rate(http_requests_total{job=~".*workflow-execution-service-api.*",status_class="5xx"}[2m]))/sum(rate(http_requests_total{job=~".*workflow-execution-service-api.*"}[2m]))'
          sleep 120
          RATE=$(curl -sf "${PROM_URL}/api/v1/query" \
            --data-urlencode "query=${QUERY}" | jq -r '.data.result[0].value[1] // "0"')
          echo "API 5xx rate: ${RATE}"
          if awk "BEGIN{exit !($RATE > 0.01)}"; then
            echo "ERROR: API 5xx rate ${RATE} exceeds 1% — rolling back the API Deployment only"
            kubectl rollout undo deployment/workflow-execution-service-api --namespace="$K8S_NAMESPACE"
            kubectl rollout status deployment/workflow-execution-service-api --namespace="$K8S_NAMESPACE" --timeout=5m
            exit 1
          fi
          echo "API health gate passed — 5xx rate ${RATE} is below 1%"

      - name: Health gate — Worker Activity-failure rate < 1% for 2 minutes
        env:
          PROM_URL: ${{ vars.PROMETHEUS_URL }}
          K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'workflow-app' }}
        run: |
          if [ -z "$PROM_URL" ]; then
            echo "PROMETHEUS_URL not set — skipping Worker error-rate check"
            exit 0
          fi
          # The Worker serves no business HTTP traffic to measure a request
          # error-rate from (LLD §7.6) — its own equivalent signal is the
          # Activity outcome ratio from workflow_activity_duration_seconds.
          QUERY='sum(rate(workflow_activity_duration_seconds_count{outcome="failure"}[2m]))/sum(rate(workflow_activity_duration_seconds_count[2m]))'
          sleep 120
          RATE=$(curl -sf "${PROM_URL}/api/v1/query" \
            --data-urlencode "query=${QUERY}" | jq -r '.data.result[0].value[1] // "0"')
          echo "Worker Activity-failure rate: ${RATE}"
          if awk "BEGIN{exit !($RATE > 0.01)}"; then
            echo "ERROR: Worker Activity-failure rate ${RATE} exceeds 1% — rolling back the Worker Deployment only"
            kubectl rollout undo deployment/workflow-execution-service-worker --namespace="$K8S_NAMESPACE"
            kubectl rollout status deployment/workflow-execution-service-worker --namespace="$K8S_NAMESPACE" --timeout=5m
            exit 1
          fi
          echo "Worker health gate passed — Activity-failure rate ${RATE} is below 1%"

  release:
    name: GitHub Release
    needs: [deploy-gate]
    if: needs.deploy-gate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes
